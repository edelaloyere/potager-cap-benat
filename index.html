<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Potager">
  <meta name="theme-color" content="#2E7D32">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Mon Potager — Cap Bénat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --g-dark:#2E7D32; --g-mid:#388E3C; --g-pale:#E8F5E9; --g-bg:#EDF5E0;
      --text:#212121; --tl:#757575; --white:#fff;
      --nav-h:60px; --hdr-h:58px;
      --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    }
    html, body { height:100%; width:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
    body {
      background-color: var(--g-bg);
      background-image:
        radial-gradient(ellipse at 8% 12%, rgba(76,175,80,.13) 0%, transparent 55%),
        radial-gradient(ellipse at 92% 80%, rgba(139,195,74,.10) 0%, transparent 50%),
        radial-gradient(ellipse at 55% 55%, rgba(46,125,50,.06) 0%, transparent 65%),
        url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M15 65 C8 50 8 35 15 22 C22 9 35 6 35 6 C35 6 48 9 55 22 C62 35 62 50 55 65 C48 78 15 65 15 65Z' fill='%232E7D32' fill-opacity='.045'/%3E%3Ccircle cx='65' cy='18' r='5' fill='%232E7D32' fill-opacity='.04'/%3E%3C/svg%3E");
    }
    #app { display:flex; flex-direction:column; height:100dvh; }

    /* HEADER */
    .hdr { background:linear-gradient(135deg,#1B5E20 0%,#2E7D32 60%,#388E3C 100%); color:white; padding:0 14px; padding-top:var(--safe-t); height:calc(var(--hdr-h) + var(--safe-t)); display:flex; align-items:flex-end; padding-bottom:10px; justify-content:space-between; flex-shrink:0; box-shadow:0 2px 12px rgba(0,0,0,.3); }
    .hdr-left h1 { font-size:18px; font-weight:700; letter-spacing:-.3px; }
    .hdr-left p  { font-size:11px; opacity:.75; margin-top:1px; }
    .hdr-right { display:flex; gap:8px; align-items:center; }
    .hdr-btn { background:rgba(255,255,255,.18); border:none; color:white; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
    .hdr-btn.active { background:rgba(255,255,255,.35); }

    /* MAIN */
    #main { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; padding-bottom:calc(var(--nav-h) + var(--safe-b) + 80px); }

    /* NAV */
    .bnav { position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b); background:white; border-top:1px solid #E0E0E0; display:flex; box-shadow:0 -2px 10px rgba(0,0,0,.08); z-index:100; }
    .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#9E9E9E; border:none; background:none; font-size:9.5px; font-weight:500; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:color .15s; }
    .nav-btn svg { width:21px; height:21px; }
    .nav-btn.on { color:var(--g-dark); }

    /* FAB */
    .fab { position:fixed; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); right:18px; width:54px; height:54px; background:linear-gradient(145deg,#388E3C,#1B5E20); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(46,125,50,.45); border:none; cursor:pointer; z-index:90; -webkit-tap-highlight-color:transparent; }
    .fab svg { color:white; width:27px; height:27px; }

    /* CARDS */
    .card { background:rgba(255,255,255,.93); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 8px rgba(0,0,0,.08); border:1px solid rgba(76,175,80,.08); }
    .card-row { display:flex; justify-content:space-between; align-items:flex-start; }

    /* BADGES */
    .badge { display:inline-flex; align-items:center; gap:3px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
    .bs{background:#E8F5E9;color:#2E7D32} .bm{background:#FFF3E0;color:#E65100}
    .be{background:#FFEBEE;color:#C62828} .bc{background:#E3F2FD;color:#1565C0}
    .bz{background:#F3E5F5;color:#6A1B9A;font-size:10px} .bp{background:#E8F5E9;color:#2E7D32;font-size:10px}

    /* SECTION TITLE */
    .stitle { font-size:11px; font-weight:700; color:var(--tl); text-transform:uppercase; letter-spacing:.9px; margin:18px 0 8px; }
    .stitle:first-child { margin-top:0; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 18px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .btn-p { background:linear-gradient(135deg,#388E3C,#2E7D32); color:white; }
    .btn-o { background:transparent; border:1.5px solid var(--g-dark); color:var(--g-dark); }
    .btn-d { background:transparent; border:1.5px solid #C62828; color:#C62828; font-size:13px; padding:8px 14px; }
    .btn-sm { padding:7px 13px; font-size:13px; }
    .icon-btn { background:none; border:none; cursor:pointer; padding:6px; color:var(--tl); -webkit-tap-highlight-color:transparent; display:flex; align-items:center; }

    /* MIC button */
    .mic-btn { background:none; border:1.5px solid #E0E0E0; border-radius:8px; padding:6px 9px; font-size:15px; cursor:pointer; -webkit-tap-highlight-color:transparent; flex-shrink:0; }
    .fi-row { display:flex; gap:8px; align-items:stretch; }
    .fi-row .fi { flex:1; }

    /* MOVE BUTTONS */
    .move-blk { background:rgba(255,255,255,.18); border:none; color:white; border-radius:6px; padding:4px 7px; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; line-height:1; }
    .move-tsk { background:none; border:none; color:#BDBDBD; padding:3px 5px; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; flex-shrink:0; }
    .insert-task-btn { display:flex; align-items:center; justify-content:center; gap:4px; width:100%; padding:2px 0; background:none; border:none; cursor:pointer; color:#BDBDBD; font-size:12px; font-weight:600; -webkit-tap-highlight-color:transparent; transition:color .15s; }
    .insert-task-btn:active, .insert-task-btn:hover { color:var(--g-dark); }
    .move-pos-btn { display:flex; align-items:center; gap:10px; width:100%; padding:13px 8px; border:none; background:none; border-bottom:1px solid #F0F0F0; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent; border-radius:8px; }
    .move-pos-btn.current { background:#E8F5E9; }
    .move-pos-btn:last-child { border-bottom:none; }
    .move-pos-num { font-size:11px; font-weight:700; color:#BDBDBD; min-width:20px; }
    .move-pos-ico { font-size:17px; }
    .move-pos-txt { flex:1; font-size:14px; color:var(--text); text-align:left; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .move-pos-cur { font-size:11px; color:var(--g-dark); font-weight:700; flex-shrink:0; }

    /* MODAL */
    .mo { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; display:flex; align-items:flex-end; }
    .mo-box { background:white; border-radius:22px 22px 0 0; width:100%; max-height:94dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 32px; padding-bottom:calc(32px + var(--safe-b)); animation:slideUp .28s cubic-bezier(.4,0,.2,1); position:relative; }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .mo-handle { width:38px; height:4px; background:#DDD; border-radius:2px; margin:14px auto 10px; cursor:pointer; }
    .mo-close-btn { position:absolute; top:12px; right:14px; background:rgba(0,0,0,.07); border:none; border-radius:50%; width:30px; height:30px; font-size:15px; color:#666; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; z-index:2; flex-shrink:0; }
    .mo-title { font-size:21px; font-weight:700; color:var(--g-dark); margin-bottom:18px; margin-top:8px; }

    /* FORM */
    .fg { margin-bottom:14px; }
    .flabel { display:block; font-size:12px; font-weight:700; color:var(--tl); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
    .fi { width:100%; padding:12px 13px; border:1.5px solid #E0E0E0; border-radius:10px; font-size:16px; font-family:inherit; color:var(--text); background:white; -webkit-appearance:none; }
    .fi:focus { outline:none; border-color:var(--g-dark); }
    .fta { resize:vertical; min-height:78px; }

    /* ZONE PILLS */
    .zpills { display:flex; flex-wrap:wrap; gap:8px; }
    .zpill { padding:8px 13px; border-radius:20px; border:1.5px solid #E0E0E0; font-size:13px; cursor:pointer; background:white; color:var(--text); -webkit-tap-highlight-color:transparent; }
    .zpill.on { background:var(--g-dark); color:white; border-color:var(--g-dark); }

    /* RESULT BTNS */
    .rbts { display:flex; gap:6px; flex-wrap:wrap; }
    .rbt { flex:1; min-width:70px; padding:9px 4px; border-radius:8px; border:1.5px solid #E0E0E0; font-size:12px; font-weight:600; text-align:center; cursor:pointer; background:white; -webkit-tap-highlight-color:transparent; }
    .rs{background:#E8F5E9;border-color:#43A047;color:#2E7D32} .rm{background:#FFF3E0;border-color:#FF8F00;color:#E65100}
    .re{background:#FFEBEE;border-color:#EF5350;color:#C62828} .rc{background:#E3F2FD;border-color:#42A5F5;color:#1565C0}

    /* MÉTÉO */
    .mbts { display:flex; gap:6px; flex-wrap:wrap; }
    .mbt { padding:9px 10px; border-radius:10px; border:1.5px solid #E0E0E0; font-size:22px; text-align:center; cursor:pointer; background:white; -webkit-tap-highlight-color:transparent; flex:1; min-width:44px; }
    .mbt.on { border-color:var(--g-dark); background:var(--g-pale); }

    /* ACTION ENTRY */
    .ae { background:var(--g-bg); border-radius:10px; padding:12px; margin-bottom:8px; }
    .ae-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .add-act { width:100%; padding:12px; border:2px dashed #BDBDBD; border-radius:10px; background:transparent; color:var(--tl); font-size:15px; cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent; }

    /* JOURNAL */
    .s-date { font-size:12px; color:var(--tl); font-weight:600; }
    .s-title { font-size:16px; font-weight:700; margin:3px 0 5px; }
    .s-prev { font-size:13px; color:var(--tl); line-height:1.4; }
    .s-zones { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .ai { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #F5F5F5; }
    .ai:last-child { border-bottom:none; }

    /* CULTURES */
    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .cc { background:rgba(255,255,255,.93); border-radius:12px; padding:13px; box-shadow:0 1px 6px rgba(0,0,0,.08); cursor:pointer; -webkit-tap-highlight-color:transparent; border:1px solid rgba(76,175,80,.08); user-select:none; }
    .cc-name { font-size:15px; font-weight:700; margin-bottom:3px; }
    .cc-sub  { font-size:11px; color:var(--tl); margin-bottom:7px; line-height:1.3; }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
    .ds{background:#43A047} .dc{background:#42A5F5} .de{background:#EF5350} .da{background:#BDBDBD}

    /* FILTER BAR */
    .fbar { display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; margin-bottom:12px; }
    .fbar::-webkit-scrollbar { display:none; }
    .fc { flex-shrink:0; padding:7px 13px; border-radius:20px; border:1.5px solid #E0E0E0; font-size:13px; cursor:pointer; background:white; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
    .fc.on { background:var(--g-dark); color:white; border-color:var(--g-dark); }

    /* TODOS */
    .ti { display:flex; align-items:flex-start; gap:11px; padding:13px 0; border-bottom:1px solid #F5F5F5; }
    .ti:last-child { border-bottom:none; }
    .tck { width:24px; height:24px; border-radius:7px; border:2px solid #BDBDBD; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; margin-top:1px; transition:all .15s; }
    .tck.on { background:var(--g-dark); border-color:var(--g-dark); }
    .ttxt { flex:1; font-size:15px; line-height:1.4; word-break:break-word; overflow-wrap:break-word; }
    .ttxt.done { text-decoration:line-through; color:var(--tl); }
    .ti-actions { display:flex; gap:2px; flex-shrink:0; }
    .done-card { opacity:.6; }

    /* PLANNING */
    .mc { background:rgba(255,255,255,.93); border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 8px rgba(0,0,0,.08); border:1px solid rgba(76,175,80,.1); }
    .mc-hdr { background:linear-gradient(135deg,#1B5E20,#2E7D32); color:white; padding:13px 15px; font-weight:700; font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .mc.now .mc-hdr { background:linear-gradient(135deg,#2E7D32,#43A047); }
    .mc-now-tag { font-size:11px; font-weight:600; background:rgba(255,255,255,.22); padding:2px 8px; border-radius:10px; white-space:nowrap; }
    .mc-body { padding:10px 15px; }
    .mt { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #F0F8F0; }
    .mt:last-child { border-bottom:none; }
    .mt-ico { font-size:17px; flex-shrink:0; margin-top:2px; }
    .mt-txt { flex:1; font-size:14px; line-height:1.55; word-break:break-word; overflow-wrap:break-word; }

    /* PLANNING EDIT */
    .plan-edit-banner { background:#FFF3E0; border-radius:12px; padding:12px 14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
    .plan-edit-banner span { font-size:14px; font-weight:600; color:#E65100; }
    .mc-edit-hdr { display:flex; gap:7px; align-items:center; flex:1; min-width:0; position:relative; }
    .mc-edit-ico { width:40px; padding:6px 4px; border:1.5px solid rgba(255,255,255,.5); border-radius:8px; background:rgba(255,255,255,.15); color:white; font-size:17px; text-align:center; -webkit-appearance:none; flex-shrink:0; cursor:pointer; }
    .mc-edit-lbl { flex:1; min-width:0; padding:6px 10px; border:1.5px solid rgba(255,255,255,.5); border-radius:8px; background:rgba(255,255,255,.15); color:white; font-size:14px; font-weight:600; -webkit-appearance:none; }
    .mc-edit-lbl-btn { flex:1; min-width:0; padding:6px 10px; border:1.5px solid rgba(255,255,255,.5); border-radius:8px; background:rgba(255,255,255,.15); color:white; font-size:14px; font-weight:600; text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .mc-edit-ico::placeholder,.mc-edit-lbl::placeholder { color:rgba(255,255,255,.6); }
    .mc-hdr-actions { display:flex; gap:5px; align-items:center; flex-shrink:0; }
    .mt-edit { display:flex; align-items:center; gap:6px; padding:7px 0; border-bottom:1px solid #F0F0F0; position:relative; }
    .mt-edit:last-child { border-bottom:none; }
    .mt-edit-ico { width:34px; padding:6px 2px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:15px; text-align:center; background:white; -webkit-appearance:none; flex-shrink:0; cursor:pointer; }
    .mt-edit-txt { flex:1; min-width:0; padding:8px 9px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:14px; font-family:inherit; background:white; -webkit-appearance:none; }
    .mt-edit-txt-btn { flex:1; min-width:0; padding:8px 9px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:14px; font-family:inherit; background:white; text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; color:var(--text); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .act-txt-btn { flex:1; min-width:0; padding:12px 13px; border:1.5px solid #E0E0E0; border-radius:10px; font-size:16px; font-family:inherit; background:white; text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent; color:var(--text); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .del-icon-btn { background:none; border:none; color:#EF5350; cursor:pointer; padding:5px; font-size:15px; flex-shrink:0; -webkit-tap-highlight-color:transparent; }
    .add-plan-task { width:100%; margin-top:8px; padding:10px; border:2px dashed #BDBDBD; border-radius:8px; background:transparent; color:var(--tl); font-size:13px; cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent; }
    .add-plan-block { width:100%; padding:13px; border:2px dashed var(--g-dark); border-radius:12px; background:transparent; color:var(--g-dark); font-size:15px; font-weight:600; cursor:pointer; text-align:center; margin-bottom:12px; -webkit-tap-highlight-color:transparent; }
    .del-block-btn { background:rgba(255,255,255,.2); border:none; color:white; border-radius:8px; padding:4px 8px; font-size:12px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }

    /* EMOJI PICKER */
    .emoji-picker { position:absolute; left:0; top:calc(100% + 4px); background:white; border-radius:14px; box-shadow:0 6px 28px rgba(0,0,0,.22); padding:10px; display:grid; grid-template-columns:repeat(8,1fr); gap:2px; z-index:350; width:300px; max-height:260px; overflow-y:auto; }
    .emoji-picker button { background:none; border:none; font-size:20px; padding:5px 3px; cursor:pointer; border-radius:6px; -webkit-tap-highlight-color:transparent; }

    /* PHOTOS TAB */
    .photo-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .photo-card { position:relative; border-radius:14px; overflow:hidden; aspect-ratio:4/3; background:#E8F5E9; box-shadow:0 2px 8px rgba(0,0,0,.12); cursor:pointer; }
    .photo-card img, .photo-card video { width:100%; height:100%; object-fit:cover; display:block; transition:opacity .3s; }
    .photo-card img[data-loaded="0"] { opacity:0; }
    .photo-date-badge { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.6)); color:white; font-size:11px; padding:10px 8px 5px; }

    /* PHOTO ACTION SHEET */
    .photo-action-btn { display:block; width:100%; padding:17px 14px; text-align:left; border:none; background:none; font-size:16px; cursor:pointer; border-bottom:1px solid #F5F5F5; -webkit-tap-highlight-color:transparent; color:var(--text); }
    .photo-action-btn:last-child { border-bottom:none; }
    .photo-action-btn.danger { color:#C62828; }
    .photo-action-btn.pcancel { text-align:center; color:var(--tl); font-weight:600; background:#F5F5F5; border-radius:12px; margin-top:10px; }

    /* AI ANALYSIS BADGE */
    .ai-badge { position:absolute; top:6px; right:6px; background:rgba(46,125,50,.85); color:white; border-radius:20px; font-size:10px; font-weight:700; padding:3px 7px; letter-spacing:.2px; backdrop-filter:blur(4px); }

    /* BULLET TOOLBAR */
    .btoolbar { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px; }
    .bt-btn { padding:5px 11px; border-radius:8px; border:1.5px solid #E0E0E0; background:white; font-size:12px; cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap; color:var(--text); -webkit-tap-highlight-color:transparent; }

    /* VOICE MODAL */
    .vmo { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:400; display:flex; align-items:center; justify-content:center; padding:20px; }
    .vmo-card { background:white; border-radius:22px; padding:24px 22px; width:100%; max-width:380px; box-shadow:0 8px 40px rgba(0,0,0,.25); animation:popIn .25s cubic-bezier(.4,0,.2,1); }
    @keyframes popIn { from{transform:scale(.92);opacity:0} to{transform:scale(1);opacity:1} }
    .vmo-title { font-size:20px; font-weight:800; color:var(--g-dark); text-align:center; margin-bottom:4px; }
    .vmo-status { font-size:13px; color:var(--tl); text-align:center; margin-bottom:18px; min-height:18px; }
    .wave-bars { display:flex; align-items:center; justify-content:center; gap:5px; height:44px; margin-bottom:18px; }
    .wave-bar { width:5px; border-radius:3px; background:var(--g-dark); }
    .wave-bar.active { animation:wv .75s ease-in-out infinite; }
    .wave-bar:nth-child(1) { height:14px; animation-delay:0s; }
    .wave-bar:nth-child(2) { height:22px; animation-delay:.1s; }
    .wave-bar:nth-child(3) { height:36px; animation-delay:.2s; }
    .wave-bar:nth-child(4) { height:22px; animation-delay:.1s; }
    .wave-bar:nth-child(5) { height:14px; animation-delay:0s; }
    @keyframes wv { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1.3)} }
    .wave-bar.paused { background:#BDBDBD; animation:none; }

    /* SOWING CALENDAR */
    .cal-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; border:1px solid #E0E0E0; }

// INDEXEDDB (photos)
// =====================================================
let _mdb = null;
function openMediaDB(cb) {
  if (_mdb) { cb(_mdb); return; }
  const req = indexedDB.open('potager_media', 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore('blobs');
  req.onsuccess = e => { _mdb = e.target.result; cb(_mdb); };
  req.onerror   = () => cb(null);
}
function saveBlob(id, blob, cb) {
  openMediaDB(db => {
    if (!db) { cb(false); return; }
    const tx = db.transaction('blobs','readwrite');
    tx.objectStore('blobs').put(blob, id);
    tx.oncomplete = () => cb(true);
    tx.onerror    = () => cb(false);
  });
}
function getBlobUrl(id, cb) {
  openMediaDB(db => {
    if (!db) { cb(null); return; }
    const req = db.transaction('blobs').objectStore('blobs').get(id);
    req.onsuccess = e => cb(e.target.result ? URL.createObjectURL(e.target.result) : null);
    req.onerror   = () => cb(null);
  });
}
function deleteBlob(id, cb) {
  openMediaDB(db => {
    if (!db) { if(cb) cb(); return; }
    const tx = db.transaction('blobs','readwrite');
    tx.objectStore('blobs').delete(id);
    tx.oncomplete = () => { if(cb) cb(); };
  });
}
function resizeAndSave(id, file, cb) {
  if (!file.type.startsWith('image/')) { saveBlob(id, file, cb); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new window.Image();
    img.onload = () => {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(blob => saveBlob(id, blob, cb), 'image/jpeg', 0.82);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// =====================================================
// PLANNING <-> TODOS SYNC

function saisonForBlock(block) { return block ? block.label : 'Autres'; }

function syncPlanningToTodos() {
  S.planning.forEach(block => {
    block.tasks.forEach(task => {
      if (!task.id) task.id = uid();
      if (task.todoId) {
        const td = S.todos.find(t => t.id === task.todoId);
        if (td) {
          td.saison = saisonForBlock(block);
          if (!td.planTaskId) td.planTaskId = task.id; // répare planTaskId manquant
        }
        return;
      }
      const existing = S.todos.find(t => t.planTaskId === task.id);
      if (existing) { task.todoId = existing.id; existing.saison = saisonForBlock(block); return; }
      // Répare les orphelins : match par texte normalisé, sans contrainte de saison
      const norm = s => s?.trim().toLowerCase();
      const orphan = S.todos.find(t => t.fromPlanning && !t.planTaskId && norm(t.texte) === norm(task.texte));
      if (orphan) { task.todoId = orphan.id; orphan.planTaskId = task.id; orphan.saison = saisonForBlock(block); return; }
      const todo = { id:uid(), texte:task.texte, saison:saisonForBlock(block),
        priorite:'normale', fait:false, fromPlanning:true, planTaskId:task.id };
      task.todoId = todo.id;
      S.todos.push(todo);
    });
  });
}

function load() {
  const v5 = localStorage.getItem('potager_v5');
  if (v5) {
    try {
      const d = JSON.parse(v5);
      S.sessions = d.sessions||[]; S.todos = d.todos||[];
      S.cultures = d.cultures||[]; S.planning = d.planning||[]; S.photos = d.photos||[];
      if (!S.planning.length) S.planning = defaultPlanning();
      syncPlanningToTodos();
      return;
    } catch(e) {}
  }
  const prev = localStorage.getItem('potager_v4') || localStorage.getItem('potager_v3');
  if (prev) {
    try {
      const d = JSON.parse(prev);
      S.sessions = d.sessions||[]; S.cultures = d.cultures||[]; S.photos = [];
      S.todos = (d.todos||[]).filter(t => !t.fromPlanning);
      S.planning = defaultPlanning();
      syncPlanningToTodos();
      save(); return;
    } catch(e) {}
  }
  initData();
}

// RENDER
// =====================================================
function render() {
  const main = document.getElementById('main');
  document.querySelector('.fab')?.remove();
  const titles = { journal:'Mon Potager', planning:'Planning saisonnier', cultures:'Mes cultures', todos:'À faire', photos:'Photos & Vidéos' };
  const subs   = { journal:'Cap Bénat — Bormes-les-Mimosas', planning:'Tâches mois par mois',
    cultures:S.cultures.length+' cultures suivies', todos:S.todos.filter(t=>!t.fait).length+' tâche(s) en attente',
    photos:S.photos.length+' média(s)' };
  document.getElementById('hdr-title').textContent = titles[S.tab];
  document.getElementById('hdr-sub').textContent   = subs[S.tab];
  document.getElementById('hdr-right').innerHTML   = hdrButtons();
  switch(S.tab) {
    case 'journal':  main.innerHTML = renderJournal();  addFab(openNewSession); break;
    case 'planning': main.innerHTML = renderPlanning(); break;
    case 'cultures': main.innerHTML = renderCultures(); addFab(openNewCulture); break;
    case 'todos':    main.innerHTML = renderTodos();    addFab(openNewTodo); break;
    case 'photos':   main.innerHTML = renderPhotos();   addFab(openCamera); break;
  }
}
function hdrButtons() {
  if (S.tab === 'planning') {
    return S.planEdit
      ? `<button class="hdr-btn active" onclick="S.planEdit=false;save();render()">✓ Terminer</button>`
      : `<button class="hdr-btn" onclick="showSowingCalendar()">🗓</button><button class="hdr-btn" onclick="S.planEdit=true;render()">✏️ Modifier</button>`;
  }
  return '';
}
function addFab(fn) {
  const b = document.createElement('button'); b.className = 'fab';

    : `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;

function renderJournal() {
  const quickBar = `<div class="quick-bar">
    <button class="quick-btn" onclick="logArrosage()">💧 Arrosage rapide</button>
    <button class="quick-btn" onclick="exportPDF()">📄 Export PDF</button>
  </div>`;
  if (!S.sessions.length) return quickBar+`<div class="empty"><div class="empty-ico">🌱</div><p>Aucune session.<br>Appuie sur + pour commencer.</p></div>`;
  return quickBar+[...S.sessions].sort((a,b) => b.date.localeCompare(a.date)).map(s => {
    const ns = s.actions.filter(a=>a.resultat==='succes').length;
    const nm = s.actions.filter(a=>a.resultat==='mitige').length;
    const ne = s.actions.filter(a=>a.resultat==='echec').length;
    const nc = s.actions.filter(a=>!a.resultat||a.resultat==='encours').length;
    const prev = s.constats ? s.constats.replace(/\n/g,' ').substring(0,90)+'…' : s.actions.length+' action(s)';
    return `<div class="card" onclick="viewSession('${s.id}')">
      <div class="card-row">
        <div><div class="s-date">${s.meteo||''} ${fmtDate(s.date)}</div>
          <div class="s-title">${s.actions.length} action${s.actions.length>1?'s':''}</div></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:140px">
          ${ns?`<span class="badge bs">✓ ${ns}</span>`:''}${nm?`<span class="badge bm">~ ${nm}</span>`:''}
          ${ne?`<span class="badge be">✗ ${ne}</span>`:''}${nc?`<span class="badge bc">… ${nc}</span>`:''}
        </div>
      </div>
      <div class="s-prev">${esc(prev)}</div>
      <div class="s-zones">${[...new Set(s.zones)].map(z=>`<span class="badge bz">${z}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

function renderPlanning() {

  let html = '';
  if (S.planEdit) {
    html += `<div class="plan-edit-banner"><span>✏️ Mode édition</span><button class="btn btn-sm btn-p" onclick="S.planEdit=false;save();render()">✓ Terminer</button></div>`;
  }
  S.planning.forEach((b, bi) => {
    const now = b.months && b.months.includes(m);
    if (S.planEdit) {
      const canUp = bi > 0, canDown = bi < S.planning.length-1;
      html += `<div class="mc ${now?'now':''}">
        <div class="mc-hdr">
          <div class="mc-edit-hdr" id="ehdr-${bi}">
            <input class="mc-edit-ico" value="${esc(b.ico)}" onclick="showEmojiPicker(${bi},undefined,this)" readonly maxlength="4">
            <button class="mc-edit-lbl-btn" onclick="openLabelEditModal(${bi})">${esc(b.label)||'<span style="color:#BDBDBD">Nom du bloc</span>'}</button>
          </div>
          <div class="mc-hdr-actions">
            ${canUp?`<button class="move-blk" onclick="movePBlock(${bi},-1)">↑</button>`:''}
            ${canDown?`<button class="move-blk" onclick="movePBlock(${bi},1)">↓</button>`:''}
            ${bi < S.planning.length-1?`<button class="move-blk" title="Mettre en bas" onclick="movePBlockBottom(${bi})">⤓</button>`:''}
            <button class="del-block-btn" onclick="delPBlock(${bi})">✕</button>
          </div>
        </div>
        <div class="mc-body">
          ${b.tasks.map((t,ti)=>{
            const tid='pt-'+bi+'-'+ti;
            const canMove = b.tasks.length > 1;
            return `<div class="mt-edit" id="mte-${bi}-${ti}">
              <input class="mt-edit-ico" value="${esc(t.ico)}" onclick="showEmojiPicker(${bi},${ti},this)" readonly maxlength="4">
              <button class="mt-edit-txt-btn" onclick="openTaskEditModal(${bi},${ti})">${esc(t.texte)||'<span style="color:#BDBDBD">Nouvelle tâche</span>'}</button>
              <button class="mic-btn" onclick="openTaskEditModal(${bi},${ti},true)">🎤</button>
              ${canMove?`<button class="move-tsk" title="Déplacer" onclick="showMovePicker(${bi},${ti})">⇅</button>`:''}
              <button class="del-icon-btn" onclick="delPTask(${bi},${ti})">✕</button>
            </div>
            <button class="insert-task-btn" onclick="addPTaskAt(${bi},${ti+1})">＋</button>`;
          }).join('')}
          <button class="add-plan-task" style="margin-top:4px" onclick="addPTask(${bi})">+ Ajouter en bas</button>
        </div>
      </div>`;
    } else {
      html += `<div class="mc ${now?'now':''}">
        <div class="mc-hdr">
          <span>${esc(b.ico)} ${esc(b.label)}</span>
          ${now?`<span class="mc-now-tag">← Maintenant</span>`:''}
        </div>
        <div class="mc-body">
          ${b.tasks.map(t=>`<div class="mt"><span class="mt-ico">${esc(t.ico)}</span><span class="mt-txt">${esc(t.texte)}</span></div>`).join('')}
        </div>
      </div>`;
    }
  });
  if (S.planEdit) html += `<button class="add-plan-block" onclick="addPBlock()">+ Ajouter un bloc mensuel</button>`;
  return html;
}
function updPIco(bi,v)     { S.planning[bi].ico=v; }
function updPLabel(bi,v)   {
  const old = S.planning[bi].label;
  S.planning[bi].label = v;
  if (old !== v) S.todos.forEach(t => { if(t.fromPlanning && t.saison===old) t.saison=v; });
}
function updPTIco(bi,ti,v) { S.planning[bi].tasks[ti].ico=v; }
function updPTask(bi,ti,v) {
  const t = S.planning[bi].tasks[ti]; t.texte = v;
  if (t.todoId) { const td = S.todos.find(x=>x.id===t.todoId); if(td) td.texte = v; }
}
function delPTask(bi,ti) {
  const t = S.planning[bi].tasks[ti];
  if (t.todoId) S.todos = S.todos.filter(x=>x.id!==t.todoId);
  S.planning[bi].tasks.splice(ti,1); save(); render();
}

function addPTaskAt(bi, atIndex) {
  const task = { id:uid(), ico:'📌', texte:'Nouvelle tâche' };

  const todo = { id:uid(), texte:task.texte, saison:saisonForBlock(S.planning[bi]), priorite:'normale', fait:false, fromPlanning:true, planTaskId:task.id };
  task.todoId = todo.id; S.todos.push(todo);

function addPTask(bi) {
  const task = { id:uid(), ico:'📌', texte:'Nouvelle tâche' };
  S.planning[bi].tasks.push(task);
  const todo = { id:uid(), texte:task.texte, saison:saisonForBlock(S.planning[bi]), priorite:'normale', fait:false, fromPlanning:true, planTaskId:task.id };
  task.todoId = todo.id; S.todos.push(todo);
  save(); render();
}
function delPBlock(bi) {
  if (!confirm('Supprimer ce bloc ?')) return;
  S.planning[bi].tasks.forEach(t => { if(t.todoId) S.todos=S.todos.filter(x=>x.id!==t.todoId); });
  S.planning.splice(bi,1); save(); render();
}
function addPBlock() {
  const task = { id:uid(), ico:'📌', texte:'Nouvelle tâche' };
  const block = { id:uid(), ico:'📅', label:'Nouveau bloc', months:[], tasks:[task] };
  const todo = { id:uid(), texte:task.texte, saison:block.label, priorite:'normale', fait:false, fromPlanning:true, planTaskId:task.id };
  task.todoId = todo.id; S.todos.push(todo); S.planning.push(block);
  save(); render();
}

const _vm = { inputId:null, recognition:null, stopping:false };

function voiceModal(inputId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { snack('Saisie vocale non disponible sur ce navigateur'); return; }
  document.getElementById('vmo')?.remove();
  _vm.inputId  = inputId;
  _vm.stopping = false;
  const initial = document.getElementById(inputId)?.value || '';
  const ov = document.createElement('div'); ov.className = 'vmo'; ov.id = 'vmo';
  ov.innerHTML = `
    <div class="vmo-card">
      <div class="vmo-title">🎤 Saisie vocale</div>
      <div class="vmo-status" id="vm-status">Écoute en cours…</div>
      <div class="wave-bars" id="vm-waves">
        <div class="wave-bar active"></div><div class="wave-bar active"></div>
        <div class="wave-bar active"></div><div class="wave-bar active"></div>
        <div class="wave-bar active"></div>
      </div>
      <textarea class="vmo-transcript" id="vm-text" placeholder="Votre texte apparaît ici…">${esc(initial)}</textarea>
      <div class="vmo-interim" id="vm-interim"></div>
      <div class="vmo-btns">
        <button class="btn btn-o" onclick="voiceCancel()">Annuler</button>
        <button class="btn btn-d btn-sm" id="vm-stop-btn" onclick="voiceToggle()">⏹ Arrêter</button>
        <button class="btn btn-p btn-wide" onclick="voiceConfirm()">Valider ✓</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  _voiceStart();
}
function _voiceStart() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || _vm.stopping) return;
  _vm.recognition = new SR();
  _vm.recognition.lang = 'fr-FR';
  _vm.recognition.continuous = false;
  _vm.recognition.interimResults = true;
  _vm.recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const ta = document.getElementById('vm-text');
        if (ta) { const cur = ta.value.trim(); ta.value = cur ? cur+' '+e.results[i][0].transcript : e.results[i][0].transcript; }
      } else { interim += e.results[i][0].transcript; }
    }
    const el = document.getElementById('vm-interim'); if(el) el.textContent = interim;
  };
  _vm.recognition.onend = () => {
    const el = document.getElementById('vm-interim'); if(el) el.textContent = '';
    if (!_vm.stopping && document.getElementById('vmo')) _voiceStart();
  };
  _vm.recognition.onerror = e => {
    if (e.error === 'not-allowed') { snack('Microphone non autorisé'); voiceCancel(); }
    else if (!_vm.stopping) setTimeout(_voiceStart, 200);
  };
  try { _vm.recognition.start(); } catch(e) {}
}
function voiceToggle() {
  const btn = document.getElementById('vm-stop-btn');
  const waves = document.querySelectorAll('#vm-waves .wave-bar');
  const status = document.getElementById('vm-status');
  if (!_vm.stopping) {
    _vm.stopping = true;
    if (_vm.recognition) { try { _vm.recognition.stop(); } catch(e) {} _vm.recognition = null; }
    waves.forEach(b => b.classList.replace('active','paused'));
    if (status) status.textContent = 'Écoute arrêtée — corrigez si besoin';
    if (btn) { btn.textContent = '▶ Reprendre'; btn.className = 'btn btn-p btn-sm'; }
  } else {
    _vm.stopping = false;
    waves.forEach(b => b.classList.replace('paused','active'));
    if (status) status.textContent = 'Écoute en cours…';
    if (btn) { btn.textContent = '⏹ Arrêter'; btn.className = 'btn btn-d btn-sm'; }
    _voiceStart();
  }
}
function voiceConfirm() {
  _vm.stopping = true;
  if (_vm.recognition) { try { _vm.recognition.stop(); } catch(e) {} _vm.recognition = null; }
  const txt = document.getElementById('vm-text')?.value.trim();
  if (txt && _vm.inputId) {
    const el = document.getElementById(_vm.inputId);
    if (el) { el.value = txt; el.dispatchEvent(new Event('input')); }
  }
  document.getElementById('vmo')?.remove();
}
function voiceCancel() {
  _vm.stopping = true;
  if (_vm.recognition) { try { _vm.recognition.stop(); } catch(e) {} _vm.recognition = null; }
  document.getElementById('vmo')?.remove();
}

// TODOS

function renderTodos() {
  const rem  = S.todos.filter(t => !t.fait);
  const done = S.todos.filter(t => t.fait);
  let html = '';
  const planLabels = S.planning.map(b => b.label);
  S.planning.forEach((block) => {
    const label = block.label;
    const items = rem.filter(t => t.saison === label);
    if (!items.length) return;
    const taskPosMap = new Map(block.tasks.map((t, i) => [t.id, i]));
    const N = block.tasks.length;
    // Position d'un todo : index dans block.tasks pour les todos planning,
    // position fractionnaire entre les tâches voisines dans S.todos pour les manuels
    function pos(todo) {
      if (todo.planTaskId && taskPosMap.has(todo.planTaskId)) {
        return taskPosMap.get(todo.planTaskId);
      }
      // Fallback : match par texte normalisé (anciens todos sans planTaskId)
      const normT = s => s?.trim().toLowerCase();
      const textIdx = block.tasks.findIndex(t => normT(t.texte) === normT(todo.texte));
      if (textIdx !== -1) return textIdx;
      // Fallback : position fractionnaire entre todos planning voisins dans S.todos
      const myIdx = S.todos.indexOf(todo);
      let prev = -1, next = N;
      for (const t of items) {
        if (!t.planTaskId) continue;
        const tIdx = S.todos.indexOf(t);
        const tPos = taskPosMap.get(t.planTaskId) ?? N;
        if (tIdx < myIdx) prev = Math.max(prev, tPos);
        else              next = Math.min(next, tPos);
      }
      return (prev + next) / 2;
    }
    items.sort((a, b) => pos(a) - pos(b));
    html += `<div class="stitle">📅 ${esc(label)}</div><div class="card" style="padding:0 14px">${items.map(renderTI).join('')}</div>`;
  });
  const other = rem.filter(t => !planLabels.includes(t.saison));
  if (other.length) html += `<div class="stitle">Autres</div><div class="card" style="padding:0 14px">${other.map(renderTI).join('')}</div>`;
  if (done.length) {
    html += `<div class="stitle">Terminé — appuie pour remettre (${done.length})</div><div class="card done-card" style="padding:0 14px">${done.map(renderTI).join('')}</div>`;
  }
  return html || `<div class="empty"><div class="empty-ico">✅</div><p>Tout est fait !</p></div>`;
}

  const fp = t.fromPlanning;
  return `<div class="ti">

      <div id="settings-msg" style="margin-top:12px;font-size:13px;display:none"></div>

async function exportAppData() {
  const msgEl = document.getElementById('settings-msg');
  if(msgEl) { msgEl.style.display='block'; msgEl.style.color='#E65100'; msgEl.textContent='⏳ Export en cours…'; }
  try {
    const lsRaw = localStorage.getItem('potager_v5') || localStorage.getItem('potager_v4') || localStorage.getItem('potager_v3');
    const out = { ls: lsRaw, photos: [] };
    await new Promise((res) => {
      const r = indexedDB.open('potager_media', 1);
      r.onerror = () => res();
      r.onsuccess = e => {
        const db = e.target.result;
        try {
          const store = db.transaction('blobs').objectStore('blobs');
          const allKeys = [], allVals = [];
          store.getAllKeys().onsuccess = ev => {
            allKeys.push(...ev.target.result);
            store.getAll().onsuccess = ev2 => {
              allVals.push(...ev2.target.result);
              Promise.all(allVals.map((blob, i) => new Promise(r2 => {
                const fr = new FileReader();
                fr.onload = () => r2({ id: allKeys[i], type: blob.type || 'image/jpeg', b64: fr.result.split(',')[1] });
                fr.onerror = () => r2(null);
                fr.readAsDataURL(blob);
              }))).then(photos => { out.photos = photos.filter(Boolean); res(); });
            };
          };
        } catch(e) { res(); }
      };
    });
    if (!out.ls) {
      if(msgEl) { msgEl.style.color='#C62828'; msgEl.textContent='❌ Aucune donnée trouvée.'; }
      return;
    }
    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'potager-backup.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    if(msgEl) { msgEl.style.color='#2E7D32'; msgEl.textContent='✅ Export réussi — ' + out.photos.length + ' photo(s) incluse(s).'; }
  } catch(e) {
    if(msgEl) { msgEl.style.color='#C62828'; msgEl.textContent='❌ Erreur : ' + e.message; }
  }
}
async function importAppData(input) {
  if (!input.files[0]) return;
  const msgEl = document.getElementById('settings-msg');
  if(msgEl) { msgEl.style.display='block'; msgEl.style.color='#E65100'; msgEl.textContent='⏳ Import en cours…'; }
  try {
    const d = JSON.parse(await input.files[0].text());
    if (d.ls) localStorage.setItem('potager_v5', d.ls);
    const photos = d.photos || [];
    if (photos.length > 0) {
      const db = await new Promise((res, rej) => {
        const r = indexedDB.open('potager_media', 1);
        r.onupgradeneeded = ev => ev.target.result.createObjectStore('blobs');
        r.onerror = rej;
        r.onsuccess = ev => res(ev.target.result);
      });
      for (const p of photos) {
        try {
          const bytes = atob(p.b64);
          const arr = new Uint8Array(bytes.length);
          for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
          const blob = new Blob([arr], { type: p.type || 'image/jpeg' });
          await new Promise((res, rej) => {
            const tx = db.transaction('blobs', 'readwrite');
            tx.objectStore('blobs').put(blob, p.id);
            tx.oncomplete = res; tx.onerror = rej;
          });
        } catch(e) {}
      }
    }
    if(msgEl) { msgEl.style.color='#2E7D32'; msgEl.textContent='✅ Import réussi — ' + photos.length + ' photo(s). Rechargement…'; }
    setTimeout(() => { document.getElementById('settings-mo')?.remove(); load(); render(); }, 1500);
  } catch(e) {
    if(msgEl) { msgEl.style.color='#C62828'; msgEl.textContent='❌ Erreur : ' + e.message; }
  }
}

// =====================================================
// AI PLANT ANALYSIS
// =====================================================
function analyzePlant(id) {
  document.getElementById('photo-sheet')?.remove();
  snack('Analyse en cours… 🌿');
  openMediaDB(db => {
    if (!db) { snack('Erreur : impossible d\'accéder aux photos'); return; }
    const req = db.transaction('blobs').objectStore('blobs').get(id);
    req.onsuccess = e => {
      const blob = e.target.result;
      if (!blob) { snack('Photo introuvable'); return; }
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        const mediaType = blob.type || 'image/jpeg';
        try {
          const r = await fetch('https://potager-app-one.vercel.app/api/analyze-plant', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64, mediaType })
          });
          if (!r.ok) throw new Error('API error ' + r.status);
          const data = await r.json();
          const p = S.photos.find(x => x.id === id);
          if (p) { p.aiAnalysis = data.analysis; save(); render(); }
          showAiResult(data.analysis);
        } catch(err) {
          snack('Erreur lors de l\'analyse. Réessaie.');
        }
      };
      reader.readAsDataURL(blob);
    };
    req.onerror = () => snack('Erreur accès photo');
  });
}
function showAiResult(text) {
  document.getElementById('ai-result-mo')?.remove();
  const mo = document.createElement('div');
  mo.className = 'mo'; mo.id = 'ai-result-mo';
  mo.onclick = e => { if(e.target===mo) mo.remove(); };
  const escaped = text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  mo.innerHTML = `
    <div class="mo-box">
      <div class="mo-handle" onclick="document.getElementById('ai-result-mo').remove()"></div>
      <div class="mo-title">🌿 Analyse IA</div>
      <div style="font-size:15px;line-height:1.65;color:var(--text);white-space:pre-wrap">${escaped}</div>
      <div style="margin-top:22px">
        <button class="btn btn-p" style="width:100%" onclick="document.getElementById('ai-result-mo').remove()">OK</button>
      </div>
    </div>`;
  document.body.appendChild(mo);
}

// WEATHER AUTO
// =====================================================
function wmoToEmoji(c) {
  if (c <= 1)  return '☀️';
  if (c <= 3)  return '⛅';
  if (c <= 48) return '⛅';
  if (c <= 67) return '🌧️';
  if (c <= 77) return '❄️';
  if (c <= 82) return '🌦️';
  if (c >= 95) return '🌩️';
  return '⛅';
}
async function autoWeather() {
  const date = document.getElementById('f-date')?.value;
  if (!date) { snack('Choisis d\'abord une date'); return; }
  snack('Récupération météo…');
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=43.14&longitude=6.38&daily=weathercode&timezone=Europe%2FParis&start_date=${date}&end_date=${date}`);
    const d = await r.json();
    const code = d.daily?.weathercode?.[0];
    if (code === undefined) { snack('Météo non disponible pour cette date'); return; }
    const emoji = wmoToEmoji(code);
    document.querySelectorAll('.mbt').forEach(b => b.classList.remove('on'));
    const btn = [...document.querySelectorAll('.mbt')].find(b => b.dataset.m === emoji);
    if (btn) btn.classList.add('on');
    else document.querySelector('.mbt')?.classList.add('on');
    snack('Météo détectée : '+emoji);
  } catch(e) { snack('Météo non disponible'); }
}

// =====================================================
function bulletToolbar(targetId) {
  return `<div class="btoolbar">
    <button type="button" class="bt-btn" onclick="insertBullet('${targetId}','• ')">• Puce</button>
    <button type="button" class="bt-btn" onclick="insertNumBullet('${targetId}')">1. Num</button>
    <button type="button" class="bt-btn" onclick="insertBullet('${targetId}','⚠️ ')">⚠️ Note</button>
    <button type="button" class="bt-btn" onclick="insertBullet('${targetId}','→ ')">→ Action</button>
    <button type="button" class="bt-btn" onclick="insertBullet('${targetId}','✓ ')">✓ Fait</button>
  </div>`;
}
function insertBullet(id, prefix) {
  const el = document.getElementById(id); if (!el) return;
  const start = el.selectionStart;
  const val = el.value;
  const lineStart = val.lastIndexOf('\n', start-1) + 1;
  el.value = val.slice(0, lineStart) + prefix + val.slice(lineStart);
  const pos = lineStart + prefix.length;
  el.setSelectionRange(pos, pos);
  el.focus();
  el.dispatchEvent(new Event('input'));
}
function insertNumBullet(id) {
  const el = document.getElementById(id); if (!el) return;
  const val = el.value;
  const start = el.selectionStart;
  const before = val.slice(0, start);
  const lines = before.split('\n');
  // Count numbered lines already present
  let n = 1;
  for (const l of lines) { if (/^\d+\. /.test(l)) n++; }
  insertBullet(id, n+'. ');
}

    if (el) el.textContent = wmoToEmoji(cw.weathercode) + ' ' + Math.round(cw.temperature) + '°';
  } catch(e) {}
}

// ARROSAGE RAPIDE

function logArrosage() {
  const today = new Date().toISOString().split('T')[0];
  modal(`
    <div class="mo-handle" onclick="closeModal()"></div>
    <div class="mo-title">💧 Arrosage rapide</div>
    <div class="fg"><label class="flabel">Date</label>
      <input type="date" id="arr-date" class="fi" value="${today}">
    </div>
    <div class="fg"><label class="flabel">Zones (optionnel)</label>
      <div class="zpills">${ZONES.map(z=>`<button class="zpill" data-z="${z}" onclick="this.classList.toggle('on')">${z}</button>`).join('')}</div>
    </div>
    <div class="fg"><label class="flabel">Note (optionnel)</label>
      <input type="text" id="arr-note" class="fi" placeholder="ex: 30 min + urée 10%">
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-o" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" style="flex:2" onclick="saveArrosage()">💧 Enregistrer</button>
    </div>
  `);
}
function saveArrosage() {
  const date = document.getElementById('arr-date').value;
  if (!date) { snack('Renseigne la date'); return; }
  const zones = [...document.querySelectorAll('.zpill.on')].map(z => z.dataset.z);
  const note  = document.getElementById('arr-note').value.trim();
  const texte = note ? `Arrosage — ${note}` : 'Arrosage';
  S.sessions.push({ id:uid(), date, meteo:'💧', zones, constats:'', actions:[{id:uid(),texte,resultat:'succes'}] });
  save(); closeModal(); render(); snack('Arrosage enregistré 💧');
}

// =====================================================
// PARTAGE DE SESSION
// =====================================================
function shareSession(id) {
  const s = S.sessions.find(x => x.id === id); if (!s) return;
  const ic = { succes:'✓', mitige:'~', echec:'✗', encours:'…' };
  let text = `🌱 Potager Cap Bénat — ${fmtDate(s.date)}\n`;
  if (s.meteo) text += `Météo : ${s.meteo}\n`;
  if (s.zones.length) text += `Zones : ${s.zones.join(', ')}\n`;
  if (s.constats) text += `\nConstats :\n${s.constats}\n`;
  if (s.actions.length) {
    text += `\nActions (${s.actions.length}) :\n`;
    s.actions.forEach(a => {
      text += `${ic[a.resultat]||'…'} ${a.texte}`;
      if (a.note) text += ` (${a.note})`;
      text += '\n';
    });
  }
  if (navigator.share) {
    navigator.share({ title:'Mon Potager — Cap Bénat', text }).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(text)
      .then(() => snack('Copié dans le presse-papiers ✓'))
      .catch(() => snack('Partage non disponible'));
  }
}

// =====================================================
// EXPORT PDF
// =====================================================
function exportPDF() {
  if (!S.sessions.length) { snack('Aucune session à exporter'); return; }
  const sessions = [...S.sessions].sort((a,b) => b.date.localeCompare(a.date));
  const ic = { succes:'✓', mitige:'~', echec:'✗', encours:'…' };
  const bc = { succes:'#43A047', mitige:'#FF8F00', echec:'#EF5350', encours:'#42A5F5' };
  let body = '';
  sessions.forEach(s => {
    const ns = s.actions.filter(a=>a.resultat==='succes').length;
    const ne = s.actions.filter(a=>a.resultat==='echec').length;
    body += `<div class="session">
      <div class="s-hdr">
        <span class="s-date">${s.meteo||''} ${fmtDate(s.date)}</span>
        <span class="s-stats">${ns?`<b style="color:#43A047">✓${ns}</b> `:''}${ne?`<b style="color:#EF5350">✗${ne}</b>`:''}
        </span>
      </div>
      ${s.zones.length?`<div class="s-zones">📍 ${s.zones.join(' · ')}</div>`:''}
      ${s.constats?`<div class="s-constats">${s.constats.replace(/\n/g,'<br>')}</div>`:''}
      ${s.actions.map(a=>`<div class="action"><span style="color:${bc[a.resultat]||'#42A5F5'};font-weight:700">${ic[a.resultat]||'…'}</span>
        ${a.texte}${a.note?`<span class="a-note"> — ${a.note}</span>`:''}</div>`).join('')}
    </div>`;
  });
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
  <title>Mon Potager — Cap Bénat</title>
  <style>
    body{font-family:-apple-system,Helvetica,sans-serif;color:#212121;padding:24px 20px;max-width:720px;margin:0 auto;font-size:13px}
    h1{color:#2E7D32;font-size:22px;margin-bottom:4px}
    .sub{color:#757575;font-size:12px;margin-bottom:20px}
    .session{border:1px solid #E0E0E0;border-radius:8px;padding:14px;margin-bottom:16px;page-break-inside:avoid}
    .s-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
    .s-date{font-weight:700;font-size:14px;color:#2E7D32}
    .s-stats{font-size:12px}
    .s-zones{font-size:11px;color:#757575;margin-bottom:8px}
    .s-constats{background:#F5F5F5;border-radius:6px;padding:8px;font-size:12px;margin-bottom:8px;white-space:pre-line}
    .action{padding:3px 0;border-bottom:1px solid #F5F5F5;font-size:12px}
    .a-note{color:#757575;font-size:11px}
    @media print{body{padding:0}.session{break-inside:avoid}}
  </style></head><body>
  <h1>🌱 Mon Potager — Cap Bénat</h1>
  <div class="sub">Bilan au ${new Date().toLocaleDateString('fr-FR')} — ${sessions.length} session(s)</div>
  ${body}</body></html>`;
  const w = window.open('', '_blank');
  if (!w) { snack('Autorise les popups pour exporter'); return; }
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 600);
}

// =====================================================
// CALENDRIER DE SEMIS
// =====================================================
function showSowingCalendar() {
  const months = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  const cur = new Date().getMonth();
  let thead = `<tr><th>Légume</th>${months.map((m,i)=>`<th class="${i===cur?'cal-cur':''}">${m}</th>`).join('')}</tr>`;
  let tbody = SOWING_CAL.map(v => {
    let row = `<tr><td>${v.nom}</td>`;
    for (let m=0; m<12; m++) {
      const si = v.si.includes(m), se = v.se.includes(m), re = v.re.includes(m), rc = v.rc.includes(m);
      let cell = '';
      if (si) cell += '🌱';
      if (se) cell += '🌿';
      if (re) cell += '↳';
      if (rc) cell += '🥗';
      row += `<td style="${m===cur?'outline:2px solid #2E7D32;':''}">${cell}</td>`;
    }
    return row + '</tr>';
  }).join('');
  modal(`
    <div class="mo-handle" onclick="closeModal()"></div>
    <div class="mo-title">🗓 Calendrier de semis</div>
    <div class="cal-legend">
      <span>🌱 Semis intérieur</span>
      <span>🌿 Semis extérieur</span>
      <span>↳ Repiquage</span>
      <span>🥗 Récolte</span>
    </div>
    <div class="cal-wrap"><table class="cal-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>
    <p style="font-size:11px;color:var(--tl);margin-top:10px;text-align:center">Adapté au climat méditerranéen — Cap Bénat</p>
    <button class="btn btn-p" style="width:100%;margin-top:12px" onclick="closeModal()">Fermer</button>
  `);
}
