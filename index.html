<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Potager">
  <meta name="theme-color" content="#2E7D32">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Mon Potager — Cap Bénat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --g-dark:#2E7D32; --g-mid:#388E3C; --g-pale:#E8F5E9; --g-bg:#EDF5E0;
      --text:#212121; --tl:#757575; --white:#fff;
      --nav-h:60px; --hdr-h:58px;
      --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    }

    html, body { height:100%; width:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }

    /* Garden background */
    body {
      background-color: var(--g-bg);
      background-image:
        radial-gradient(ellipse at 8% 12%, rgba(76,175,80,.13) 0%, transparent 55%),
        radial-gradient(ellipse at 92% 80%, rgba(139,195,74,.10) 0%, transparent 50%),
        radial-gradient(ellipse at 55% 55%, rgba(46,125,50,.06) 0%, transparent 65%),
        url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M15 65 C8 50 8 35 15 22 C22 9 35 6 35 6 C35 6 48 9 55 22 C62 35 62 50 55 65 C48 78 15 65 15 65Z' fill='%232E7D32' fill-opacity='.045'/%3E%3Ccircle cx='65' cy='18' r='5' fill='%232E7D32' fill-opacity='.04'/%3E%3C/svg%3E");
    }
    #app { display:flex; flex-direction:column; height:100dvh; }

    /* HEADER */
    .hdr {
      background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 60%, #388E3C 100%);
      color:white; padding:0 14px; padding-top:var(--safe-t);
      height:calc(var(--hdr-h) + var(--safe-t));
      display:flex; align-items:flex-end; padding-bottom:10px;
      justify-content:space-between; flex-shrink:0;
      box-shadow:0 2px 12px rgba(0,0,0,.3);
    }
    .hdr-left h1 { font-size:18px; font-weight:700; letter-spacing:-.3px; }
    .hdr-left p  { font-size:11px; opacity:.75; margin-top:1px; }
    .hdr-right { display:flex; gap:8px; align-items:center; }
    .hdr-btn { background:rgba(255,255,255,.18); border:none; color:white; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
    .hdr-btn.active { background:rgba(255,255,255,.35); }

    /* MAIN */
    #main { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; padding-bottom:calc(var(--nav-h) + var(--safe-b) + 80px); }

    /* NAV (5 tabs) */
    .bnav { position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b); background:white; border-top:1px solid #E0E0E0; display:flex; box-shadow:0 -2px 10px rgba(0,0,0,.08); z-index:100; }
    .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#9E9E9E; border:none; background:none; font-size:9.5px; font-weight:500; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:color .15s; }
    .nav-btn svg { width:21px; height:21px; }
    .nav-btn.on { color:var(--g-dark); }

    /* FAB */
    .fab { position:fixed; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); right:18px; width:54px; height:54px; background:linear-gradient(145deg,#388E3C,#1B5E20); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(46,125,50,.45); border:none; cursor:pointer; z-index:90; -webkit-tap-highlight-color:transparent; }
    .fab svg { color:white; width:27px; height:27px; }

    /* CARDS */
    .card { background:rgba(255,255,255,.93); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 8px rgba(0,0,0,.08); border:1px solid rgba(76,175,80,.08); }
    .card-row { display:flex; justify-content:space-between; align-items:flex-start; }

    /* BADGES */
    .badge { display:inline-flex; align-items:center; gap:3px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
    .bs{background:#E8F5E9;color:#2E7D32} .bm{background:#FFF3E0;color:#E65100}
    .be{background:#FFEBEE;color:#C62828} .bc{background:#E3F2FD;color:#1565C0}
    .bz{background:#F3E5F5;color:#6A1B9A;font-size:10px} .bp{background:#E8F5E9;color:#2E7D32;font-size:10px}

    /* SECTION TITLE */
    .stitle { font-size:11px; font-weight:700; color:var(--tl); text-transform:uppercase; letter-spacing:.9px; margin:18px 0 8px; }
    .stitle:first-child { margin-top:0; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 18px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .btn-p { background:linear-gradient(135deg,#388E3C,#2E7D32); color:white; }
    .btn-o { background:transparent; border:1.5px solid var(--g-dark); color:var(--g-dark); }
    .btn-d { background:transparent; border:1.5px solid #C62828; color:#C62828; font-size:13px; padding:8px 14px; }
    .btn-sm { padding:7px 13px; font-size:13px; }
    .icon-btn { background:none; border:none; cursor:pointer; padding:6px; color:var(--tl); -webkit-tap-highlight-color:transparent; display:flex; align-items:center; }

    /* MIC button (inline, small) */
    .mic-btn { background:none; border:1.5px solid #E0E0E0; border-radius:8px; padding:6px 9px; font-size:15px; cursor:pointer; -webkit-tap-highlight-color:transparent; flex-shrink:0; }
    .fi-row { display:flex; gap:8px; align-items:stretch; }
    .fi-row .fi { flex:1; }

    /* MOVE BUTTONS */
    .move-blk { background:rgba(255,255,255,.18); border:none; color:white; border-radius:6px; padding:4px 7px; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; line-height:1; }
    .move-tsk { background:none; border:none; color:#BDBDBD; padding:3px 5px; font-size:13px; cursor:pointer; -webkit-tap-highlight-color:transparent; flex-shrink:0; }

    /* MODAL */
    .mo { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; display:flex; align-items:flex-end; }
    .mo-box { background:white; border-radius:22px 22px 0 0; width:100%; max-height:94dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 32px; padding-bottom:calc(32px + var(--safe-b)); animation:slideUp .28s cubic-bezier(.4,0,.2,1); }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .mo-handle { width:38px; height:4px; background:#DDD; border-radius:2px; margin:14px auto 18px; }
    .mo-title { font-size:21px; font-weight:700; color:var(--g-dark); margin-bottom:18px; }

    /* FORM */
    .fg { margin-bottom:14px; }
    .flabel { display:block; font-size:12px; font-weight:700; color:var(--tl); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
    .fi { width:100%; padding:12px 13px; border:1.5px solid #E0E0E0; border-radius:10px; font-size:16px; font-family:inherit; color:var(--text); background:white; -webkit-appearance:none; }
    .fi:focus { outline:none; border-color:var(--g-dark); }
    .fta { resize:vertical; min-height:78px; }

    /* ZONE PILLS */
    .zpills { display:flex; flex-wrap:wrap; gap:8px; }
    .zpill { padding:8px 13px; border-radius:20px; border:1.5px solid #E0E0E0; font-size:13px; cursor:pointer; background:white; color:var(--text); -webkit-tap-highlight-color:transparent; }
    .zpill.on { background:var(--g-dark); color:white; border-color:var(--g-dark); }

    /* RESULT BTNS */
    .rbts { display:flex; gap:6px; flex-wrap:wrap; }
    .rbt { flex:1; min-width:70px; padding:9px 4px; border-radius:8px; border:1.5px solid #E0E0E0; font-size:12px; font-weight:600; text-align:center; cursor:pointer; background:white; -webkit-tap-highlight-color:transparent; }
    .rs{background:#E8F5E9;border-color:#43A047;color:#2E7D32} .rm{background:#FFF3E0;border-color:#FF8F00;color:#E65100}
    .re{background:#FFEBEE;border-color:#EF5350;color:#C62828} .rc{background:#E3F2FD;border-color:#42A5F5;color:#1565C0}

    /* MÉTÉO */
    .mbts { display:flex; gap:8px; }
    .mbt { flex:1; padding:10px; border-radius:10px; border:1.5px solid #E0E0E0; font-size:22px; text-align:center; cursor:pointer; background:white; -webkit-tap-highlight-color:transparent; }
    .mbt.on { border-color:var(--g-dark); background:var(--g-pale); }

    /* ACTION ENTRY */
    .ae { background:var(--g-bg); border-radius:10px; padding:12px; margin-bottom:8px; }
    .ae-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .add-act { width:100%; padding:12px; border:2px dashed #BDBDBD; border-radius:10px; background:transparent; color:var(--tl); font-size:15px; cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent; }

    /* JOURNAL */
    .s-date { font-size:12px; color:var(--tl); font-weight:600; }
    .s-title { font-size:16px; font-weight:700; margin:3px 0 5px; }
    .s-prev { font-size:13px; color:var(--tl); line-height:1.4; }
    .s-zones { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .ai { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #F5F5F5; }
    .ai:last-child { border-bottom:none; }

    /* CULTURES */
    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .cc { background:rgba(255,255,255,.93); border-radius:12px; padding:13px; box-shadow:0 1px 6px rgba(0,0,0,.08); cursor:pointer; -webkit-tap-highlight-color:transparent; border:1px solid rgba(76,175,80,.08); }
    .cc-name { font-size:15px; font-weight:700; margin-bottom:3px; }
    .cc-sub  { font-size:11px; color:var(--tl); margin-bottom:7px; line-height:1.3; }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
    .ds{background:#43A047} .dc{background:#42A5F5} .de{background:#EF5350} .da{background:#BDBDBD}

    /* FILTER BAR */
    .fbar { display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; margin-bottom:12px; }
    .fbar::-webkit-scrollbar { display:none; }
    .fc { flex-shrink:0; padding:7px 13px; border-radius:20px; border:1.5px solid #E0E0E0; font-size:13px; cursor:pointer; background:white; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
    .fc.on { background:var(--g-dark); color:white; border-color:var(--g-dark); }

    /* TODOS */
    .ti { display:flex; align-items:flex-start; gap:11px; padding:13px 0; border-bottom:1px solid #F5F5F5; }
    .ti:last-child { border-bottom:none; }
    .tck { width:24px; height:24px; border-radius:7px; border:2px solid #BDBDBD; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; margin-top:1px; transition:all .15s; }
    .tck.on { background:var(--g-dark); border-color:var(--g-dark); }
    .ttxt { flex:1; font-size:15px; line-height:1.4; word-break:break-word; overflow-wrap:break-word; }
    .ttxt.done { text-decoration:line-through; color:var(--tl); }
    .ti-actions { display:flex; gap:2px; flex-shrink:0; }
    .done-card { opacity:.6; }
    .undo-hint { font-size:11px; color:var(--g-dark); font-weight:600; margin-top:4px; }

    /* PLANNING */
    .mc { background:rgba(255,255,255,.93); border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 8px rgba(0,0,0,.08); border:1px solid rgba(76,175,80,.1); }
    .mc-hdr { background:linear-gradient(135deg,#1B5E20,#2E7D32); color:white; padding:13px 15px; font-weight:700; font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .mc.now .mc-hdr { background:linear-gradient(135deg,#2E7D32,#43A047); }
    .mc-now-tag { font-size:11px; font-weight:600; background:rgba(255,255,255,.22); padding:2px 8px; border-radius:10px; white-space:nowrap; }
    .mc-body { padding:10px 15px; }
    .mt { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #F0F8F0; }
    .mt:last-child { border-bottom:none; }
    .mt-ico { font-size:17px; flex-shrink:0; margin-top:2px; }
    .mt-txt { flex:1; font-size:14px; line-height:1.55; word-break:break-word; overflow-wrap:break-word; }

    /* PLANNING EDIT */
    .plan-edit-banner { background:#FFF3E0; border-radius:12px; padding:12px 14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
    .plan-edit-banner span { font-size:14px; font-weight:600; color:#E65100; }
    .mc-edit-hdr { display:flex; gap:7px; align-items:center; flex:1; min-width:0; }
    .mc-edit-ico { width:40px; padding:6px 4px; border:1.5px solid rgba(255,255,255,.5); border-radius:8px; background:rgba(255,255,255,.15); color:white; font-size:17px; text-align:center; -webkit-appearance:none; flex-shrink:0; }
    .mc-edit-lbl { flex:1; min-width:0; padding:6px 10px; border:1.5px solid rgba(255,255,255,.5); border-radius:8px; background:rgba(255,255,255,.15); color:white; font-size:14px; font-weight:600; -webkit-appearance:none; }
    .mc-edit-ico::placeholder,.mc-edit-lbl::placeholder { color:rgba(255,255,255,.6); }
    .mc-hdr-actions { display:flex; gap:5px; align-items:center; flex-shrink:0; }
    .mt-edit { display:flex; align-items:center; gap:6px; padding:7px 0; border-bottom:1px solid #F0F0F0; }
    .mt-edit:last-child { border-bottom:none; }
    .mt-edit-ico { width:34px; padding:6px 2px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:15px; text-align:center; background:white; -webkit-appearance:none; flex-shrink:0; }
    .mt-edit-txt { flex:1; min-width:0; padding:8px 9px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:14px; font-family:inherit; background:white; -webkit-appearance:none; }
    .del-icon-btn { background:none; border:none; color:#EF5350; cursor:pointer; padding:5px; font-size:15px; flex-shrink:0; -webkit-tap-highlight-color:transparent; }
    .add-plan-task { width:100%; margin-top:8px; padding:10px; border:2px dashed #BDBDBD; border-radius:8px; background:transparent; color:var(--tl); font-size:13px; cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent; }
    .add-plan-block { width:100%; padding:13px; border:2px dashed var(--g-dark); border-radius:12px; background:transparent; color:var(--g-dark); font-size:15px; font-weight:600; cursor:pointer; text-align:center; margin-bottom:12px; -webkit-tap-highlight-color:transparent; }
    .del-block-btn { background:rgba(255,255,255,.2); border:none; color:white; border-radius:8px; padding:4px 8px; font-size:12px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }

    /* PHOTOS TAB */
    .photo-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .photo-card { position:relative; border-radius:14px; overflow:hidden; aspect-ratio:4/3; background:#E8F5E9; box-shadow:0 2px 8px rgba(0,0,0,.12); cursor:pointer; }
    .photo-card img, .photo-card video { width:100%; height:100%; object-fit:cover; display:block; transition:opacity .3s; }
    .photo-card img[data-loaded="0"] { opacity:0; }
    .photo-del { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.55); border:none; color:white; border-radius:50%; width:28px; height:28px; font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
    .photo-date-badge { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,.6)); color:white; font-size:11px; padding:10px 8px 5px; }
    .photo-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:32px; background:#F1F8E9; color:#BDBDBD; }

    /* VOICE MODAL */
    .vmo { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:400; display:flex; align-items:center; justify-content:center; padding:20px; }
    .vmo-card { background:white; border-radius:22px; padding:24px 22px; width:100%; max-width:380px; box-shadow:0 8px 40px rgba(0,0,0,.25); animation:popIn .25s cubic-bezier(.4,0,.2,1); }
    @keyframes popIn { from{transform:scale(.92);opacity:0} to{transform:scale(1);opacity:1} }
    .vmo-title { font-size:20px; font-weight:800; color:var(--g-dark); text-align:center; margin-bottom:4px; }
    .vmo-status { font-size:13px; color:var(--tl); text-align:center; margin-bottom:18px; min-height:18px; }
    .wave-bars { display:flex; align-items:center; justify-content:center; gap:5px; height:44px; margin-bottom:18px; }
    .wave-bar { width:5px; border-radius:3px; background:var(--g-dark); }
    .wave-bar.active { animation:wv .75s ease-in-out infinite; }
    .wave-bar:nth-child(1) { height:14px; animation-delay:0s; }
    .wave-bar:nth-child(2) { height:22px; animation-delay:.1s; }
    .wave-bar:nth-child(3) { height:36px; animation-delay:.2s; }
    .wave-bar:nth-child(4) { height:22px; animation-delay:.1s; }
    .wave-bar:nth-child(5) { height:14px; animation-delay:0s; }
    @keyframes wv { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1.3)} }
    .wave-bar.paused { background:#BDBDBD; animation:none; }
    .vmo-transcript { width:100%; min-height:80px; padding:11px 13px; border:1.5px solid #E0E0E0; border-radius:10px; font-size:15px; font-family:inherit; resize:vertical; margin-bottom:8px; }
    .vmo-transcript:focus { outline:none; border-color:var(--g-dark); }
    .vmo-interim { font-size:13px; color:#9E9E9E; font-style:italic; min-height:18px; margin-bottom:14px; }
    .vmo-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .vmo-btns .btn-wide { grid-column:1/-1; }

    /* CONSTAT BOX */
    .constat-box { background:var(--g-pale); border-radius:10px; padding:13px; margin-bottom:14px; font-size:14px; line-height:1.65; white-space:pre-line; border:1px solid rgba(76,175,80,.15); }

    /* EMPTY */
    .empty { text-align:center; padding:50px 20px; color:var(--tl); }
    .empty-ico { font-size:46px; margin-bottom:12px; }

    /* SNACK */
    .snack { position:fixed; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); left:14px; right:14px; background:#323232; color:white; padding:13px 15px; border-radius:10px; font-size:14px; z-index:500; display:none; animation:fadeUp .25s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-left">
      <h1 id="hdr-title">Mon Potager</h1>
      <p id="hdr-sub">Cap Bénat — Bormes-les-Mimosas</p>
    </div>
    <div class="hdr-right" id="hdr-right"></div>
  </div>
  <div id="main"></div>
  <nav class="bnav">
    <button class="nav-btn on" id="btn-journal" onclick="go('journal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h10"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Journal
    </button>
    <button class="nav-btn" id="btn-planning" onclick="go('planning')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Planning
    </button>
    <button class="nav-btn" id="btn-cultures" onclick="go('cultures')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V12M12 12C12 7 7 5 3 7M12 12C12 7 17 5 21 7"/></svg>Cultures
    </button>
    <button class="nav-btn" id="btn-todos" onclick="go('todos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>À faire
    </button>
    <button class="nav-btn" id="btn-photos" onclick="go('photos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>Photos
    </button>
  </nav>
</div>
<input type="file" id="photo-file" accept="image/*,video/*" style="display:none" onchange="handlePhotoFile(this)">
<div class="snack" id="snack"></div>

<script>
// =====================================================
// STATE
// =====================================================

function save() {
  localStorage.setItem('potager_v5', JSON.stringify({
    sessions:S.sessions, todos:S.todos, cultures:S.cultures, planning:S.planning, photos:S.photos
  }));
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// =====================================================
// INDEXEDDB (photos)
// =====================================================
let _mdb = null;
function openMediaDB(cb) {
  if (_mdb) { cb(_mdb); return; }
  const req = indexedDB.open('potager_media', 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore('blobs');
  req.onsuccess = e => { _mdb = e.target.result; cb(_mdb); };
  req.onerror   = () => cb(null);
}
function saveBlob(id, blob, cb) {
  openMediaDB(db => {
    if (!db) { cb(false); return; }
    const tx = db.transaction('blobs','readwrite');
    tx.objectStore('blobs').put(blob, id);
    tx.oncomplete = () => cb(true);
    tx.onerror    = () => cb(false);
  });
}
function getBlobUrl(id, cb) {
  openMediaDB(db => {
    if (!db) { cb(null); return; }
    const req = db.transaction('blobs').objectStore('blobs').get(id);
    req.onsuccess = e => cb(e.target.result ? URL.createObjectURL(e.target.result) : null);
    req.onerror   = () => cb(null);
  });
}
function deleteBlob(id, cb) {
  openMediaDB(db => {
    if (!db) { if(cb) cb(); return; }
    const tx = db.transaction('blobs','readwrite');
    tx.objectStore('blobs').delete(id);
    tx.oncomplete = () => { if(cb) cb(); };
  });
}
function resizeAndSave(id, file, cb) {
  if (!file.type.startsWith('image/')) { saveBlob(id, file, cb); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new window.Image();
    img.onload = () => {
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(blob => saveBlob(id, blob, cb), 'image/jpeg', 0.82);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// =====================================================
// PLANNING <-> TODOS SYNC
// =====================================================
function saisonFromMonths(months) {
  if (!months || !months.length) return 'Prochain passage';
  const m = months[0];
  if (m===4) return 'Prochain passage';
  if (m===5||m===6||m===7) return 'Été';
  if (m===8||m===9||m===10) return 'Automne';
  if (m===11||m===0||m===1) return 'Hiver';
  return 'Printemps';
}
function syncPlanningToTodos() {
  S.planning.forEach(block => {
    block.tasks.forEach(task => {
      if (task.todoId) return;
      const existing = S.todos.find(t => t.planTaskId === task.id);
      if (existing) { task.todoId = existing.id; return; }
      const todo = { id:uid(), texte:task.texte, saison:saisonFromMonths(block.months),
        priorite:'normale', fait:false, fromPlanning:true, planTaskId:task.id };
      task.todoId = todo.id;
      S.todos.push(todo);
    });
  });
}

// =====================================================
// LOAD / MIGRATE
// =====================================================
function load() {
  const v5 = localStorage.getItem('potager_v5');
  if (v5) {
    try {
      const d = JSON.parse(v5);
      S.sessions = d.sessions||[]; S.todos = d.todos||[];
      S.cultures = d.cultures||[]; S.planning = d.planning||[]; S.photos = d.photos||[];
      if (!S.planning.length) S.planning = defaultPlanning();
      return;
    } catch(e) {}
  }
  // Migrate from v4
  const prev = localStorage.getItem('potager_v4') || localStorage.getItem('potager_v3');
  if (prev) {
    try {
      const d = JSON.parse(prev);
      S.sessions = d.sessions||[]; S.cultures = d.cultures||[]; S.photos = [];
      // Keep non-planning todos, regenerate planning todos
      S.todos = (d.todos||[]).filter(t => !t.fromPlanning);
      S.planning = defaultPlanning();
      syncPlanningToTodos();
      save(); return;
    } catch(e) {}
  }
  initData();
}

function go(tab) {
  S.tab = tab; S.planEdit = false;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  document.getElementById('btn-'+tab).classList.add('on');
  render();
}

      html += `<div class="mc ${now?'now':''}">

function updPIco(bi,v)     { S.planning[bi].ico=v; }
function updPLabel(bi,v)   { S.planning[bi].label=v; }
function updPTIco(bi,ti,v) { S.planning[bi].tasks[ti].ico=v; }
function updPTask(bi,ti,v) {
  const t = S.planning[bi].tasks[ti]; t.texte = v;
  if (t.todoId) { const td = S.todos.find(x=>x.id===t.todoId); if(td) td.texte = v; }
}
function delPTask(bi,ti) {
  const t = S.planning[bi].tasks[ti];
  if (t.todoId) S.todos = S.todos.filter(x=>x.id!==t.todoId);
  S.planning[bi].tasks.splice(ti,1); save(); render();
}
function addPTask(bi) {
  const task = { id:uid(), ico:'📌', texte:'Nouvelle tâche' };
  S.planning[bi].tasks.push(task);
  const todo = { id:uid(), texte:task.texte, saison:saisonFromMonths(S.planning[bi].months), priorite:'normale', fait:false, fromPlanning:true, planTaskId:task.id };
  task.todoId = todo.id; S.todos.push(todo);
  save(); render();
}
function delPBlock(bi) {
  if (!confirm('Supprimer ce bloc ?')) return;
  S.planning[bi].tasks.forEach(t => { if(t.todoId) S.todos=S.todos.filter(x=>x.id!==t.todoId); });
  S.planning.splice(bi,1); save(); render();
}
function addPBlock() {
  const task = { id:uid(), ico:'📌', texte:'Nouvelle tâche' };
  const block = { id:uid(), ico:'📅', label:'Nouveau bloc', months:[], tasks:[task] };
  const todo = { id:uid(), texte:task.texte, saison:'Prochain passage', priorite:'normale', fait:false, fromPlanning:true, planTaskId:task.id };
  task.todoId = todo.id; S.todos.push(todo); S.planning.push(block);
  save(); render();
}
function movePBlock(bi,dir) {
  const ni=bi+dir; if(ni<0||ni>=S.planning.length) return;
  [S.planning[bi],S.planning[ni]]=[S.planning[ni],S.planning[bi]]; save(); render();
}
function movePTask(bi,ti,dir) {
  const tasks=S.planning[bi].tasks, ni=ti+dir;
  if(ni<0||ni>=tasks.length) return;
  [tasks[ti],tasks[ni]]=[tasks[ni],tasks[ti]]; save(); render();
}

const _vm = { inputId:null, recognition:null, stopping:false };

function voiceModal(inputId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { snack('Saisie vocale non disponible sur ce navigateur'); return; }
  document.getElementById('vmo')?.remove();

  _vm.inputId  = inputId;
  _vm.stopping = false;

  const initial = document.getElementById(inputId)?.value || '';

  const ov = document.createElement('div'); ov.className = 'vmo'; ov.id = 'vmo';
  ov.innerHTML = `
    <div class="vmo-card">
      <div class="vmo-title">🎤 Saisie vocale</div>
      <div class="vmo-status" id="vm-status">Écoute en cours…</div>
      <div class="wave-bars" id="vm-waves">
        <div class="wave-bar active"></div>
        <div class="wave-bar active"></div>
        <div class="wave-bar active"></div>
        <div class="wave-bar active"></div>
        <div class="wave-bar active"></div>
      </div>
      <textarea class="vmo-transcript" id="vm-text" placeholder="Votre texte apparaît ici…">${esc(initial)}</textarea>
      <div class="vmo-interim" id="vm-interim"></div>
      <div class="vmo-btns">
        <button class="btn btn-o" onclick="voiceCancel()">Annuler</button>
        <button class="btn btn-d btn-sm" id="vm-stop-btn" onclick="voiceToggle()">⏹ Arrêter</button>
        <button class="btn btn-p btn-wide" onclick="voiceConfirm()">Valider ✓</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  _voiceStart();
}

function _voiceStart() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || _vm.stopping) return;
  _vm.recognition = new SR();
  _vm.recognition.lang = 'fr-FR';
  _vm.recognition.continuous = false;
  _vm.recognition.interimResults = true;
  _vm.recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const ta = document.getElementById('vm-text');
        if (ta) { const cur = ta.value.trim(); ta.value = cur ? cur+' '+e.results[i][0].transcript : e.results[i][0].transcript; }
      } else { interim += e.results[i][0].transcript; }
    }
    const el = document.getElementById('vm-interim'); if(el) el.textContent = interim;
  };
  _vm.recognition.onend = () => {
    const el = document.getElementById('vm-interim'); if(el) el.textContent = '';
    if (!_vm.stopping && document.getElementById('vmo')) _voiceStart();
  };
  _vm.recognition.onerror = e => {
    if (e.error === 'not-allowed') { snack('Microphone non autorisé'); voiceCancel(); }
    else if (!_vm.stopping) setTimeout(_voiceStart, 200);
  };
  try { _vm.recognition.start(); } catch(e) {}
}

function voiceToggle() {
  const btn = document.getElementById('vm-stop-btn');
  const waves = document.querySelectorAll('#vm-waves .wave-bar');
  const status = document.getElementById('vm-status');
  if (!_vm.stopping) {
    _vm.stopping = true;
    if (_vm.recognition) { try { _vm.recognition.stop(); } catch(e) {} _vm.recognition = null; }
    waves.forEach(b => b.classList.replace('active','paused'));
    if (status) status.textContent = 'Écoute arrêtée — corrigez si besoin';
    if (btn) { btn.textContent = '▶ Reprendre'; btn.className = 'btn btn-p btn-sm'; }
  } else {
    _vm.stopping = false;
    waves.forEach(b => b.classList.replace('paused','active'));
    if (status) status.textContent = 'Écoute en cours…';
    if (btn) { btn.textContent = '⏹ Arrêter'; btn.className = 'btn btn-d btn-sm'; }
    _voiceStart();
  }
}
function voiceConfirm() {
  _vm.stopping = true;
  if (_vm.recognition) { try { _vm.recognition.stop(); } catch(e) {} _vm.recognition = null; }
  const txt = document.getElementById('vm-text')?.value.trim();
  if (txt && _vm.inputId) {
    const el = document.getElementById(_vm.inputId);
    if (el) { el.value = txt; el.dispatchEvent(new Event('input')); }
  }
  document.getElementById('vmo')?.remove();
}
function voiceCancel() {
  _vm.stopping = true;
  if (_vm.recognition) { try { _vm.recognition.stop(); } catch(e) {} _vm.recognition = null; }
  document.getElementById('vmo')?.remove();
}

function renderPhotos() {
  if (!S.photos.length) {
    return `<div class="empty"><div class="empty-ico">📷</div><p>Aucune photo.<br>Appuie sur 📷 pour en ajouter.</p></div>`;
  }
  const groups = {};
  [...S.photos].sort((a,b)=>b.date.localeCompare(a.date)).forEach(p => {
    const k = p.date.substring(0,7);
    if (!groups[k]) groups[k] = [];
    groups[k].push(p);
  });
  let html = '';
  Object.keys(groups).sort().reverse().forEach(k => {
    const [y,m] = k.split('-');
    const label = new Date(+y, +m-1, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
    html += `<div class="stitle">📅 ${label}</div><div class="photo-grid">`;
    groups[k].forEach(p => {
      const isVideo = p.type && p.type.startsWith('video/');
      html += `<div class="photo-card" onclick="viewPhotoModal('${p.id}')">
        ${isVideo
          ? `<video id="pimg-${p.id}" style="width:100%;height:100%;object-fit:cover" playsinline muted></video>`
          : `<img id="pimg-${p.id}" data-loaded="0" class="photo-thumb" alt="">`}
        <div class="photo-date-badge">${fmtDateShort(p.date)}</div>
        <button class="photo-del" onclick="deletePhoto('${p.id}',event)">✕</button>
      </div>`;
    });
    html += '</div>';
  });
  setTimeout(loadPhotoThumbs, 60);
  return html;
}
function loadPhotoThumbs() {
  S.photos.forEach(p => {
    const el = document.getElementById('pimg-'+p.id);
    if (!el) return;
    getBlobUrl(p.id, url => {
      if (!url) return;
      el.src = url;
      el.setAttribute('data-loaded','1');
      el.style.opacity = '1';
    });
  });
}
function openCamera() { document.getElementById('photo-file').click(); }
function handlePhotoFile(input) {
  if (!input.files.length) return;
  const file = input.files[0];
  const id   = uid();
  const meta = { id, date:new Date().toISOString().split('T')[0], type:file.type };

function deletePhoto(id, e) {

function viewPhotoModal(id) {
  getBlobUrl(id, url => {

    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <input type="text" id="${tid}" class="fi act-txt" style="flex:1" placeholder="Décris l'action…" value="${esc(a?a.texte:'')}">
      <button class="mic-btn" onclick="voiceModal('${tid}')">🎤</button>
    </div>
    <div class="rbts">
      <button class="rbt ${a&&a.resultat==='succes'?'rs':''}" data-v="succes" onclick="selR(this)">✓ Succès</button>
      <button class="rbt ${a&&a.resultat==='mitige'?'rm':''}" data-v="mitige" onclick="selR(this)">~ Mitigé</button>
      <button class="rbt ${a&&a.resultat==='echec'?'re':''}" data-v="echec"  onclick="selR(this)">✗ Échec</button>
      <button class="rbt ${a&&a.resultat==='encours'?'rc':''}" data-v="encours" onclick="selR(this)">… En cours</button>
    </div>
  </div>`;
}
function openNewSession() { sessionForm(null); }
function editSession(id)  { const s = S.sessions.find(x=>x.id===id); if(s) sessionForm(s); }
function addAct() { document.getElementById('f-actions').insertAdjacentHTML('beforeend', actionField(null)); }
function selM(b) { document.querySelectorAll('.mbt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }
function selR(b) {
  const map = { succes:'rs', mitige:'rm', echec:'re', encours:'rc' };
  b.closest('.rbts').querySelectorAll('.rbt').forEach(x=>{ x.className='rbt'; });
  b.classList.add(map[b.dataset.v]);
}
function saveSession(existingId) {
  const date = document.getElementById('f-date').value;
  if (!date) { snack('Renseigne la date'); return; }
  const meteo    = document.querySelector('.mbt.on')?.dataset.m || '';
  const zones    = [...document.querySelectorAll('.zpill.on')].map(z=>z.dataset.z);
  const constats = document.getElementById('f-constats').value.trim();
  const actions  = [...document.querySelectorAll('.ae')].map(e => {
    const txt = e.querySelector('.act-txt').value.trim();
    const rb  = e.querySelector('.rbt.rs,.rbt.rm,.rbt.re,.rbt.rc');
    return txt ? { id:uid(), texte:txt, resultat:rb?rb.dataset.v:'encours' } : null;
  }).filter(Boolean);
  if (existingId) {
    const i = S.sessions.findIndex(x=>x.id===existingId);
    if (i>=0) S.sessions[i] = { ...S.sessions[i], date, meteo, zones, constats, actions };
    snack('Session modifiée ✓');
  } else {
    S.sessions.push({ id:uid(), date, meteo, zones, constats, actions });
    snack('Session enregistrée ✓');
  }
  save(); closeModal(); render();
}

// =====================================================
// SESSION — VIEW
// =====================================================
function viewSession(id) {
  const s = S.sessions.find(x=>x.id===id); if (!s) return;
  const ic = { succes:'✓', mitige:'~', echec:'✗', encours:'…' };
  const bc = { succes:'bs', mitige:'bm', echec:'be', encours:'bc' };
  modal(`
    <div class="mo-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
      <div>
        <div style="font-size:22px;font-weight:800;color:var(--g-dark)">${esc(s.meteo)||''} ${fmtDate(s.date)}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${[...new Set(s.zones)].map(z=>`<span class="badge bz">${esc(z)}</span>`).join('')}</div>
      </div>
    </div>
    ${s.constats?`<div class="constat-box"><span style="font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:6px">Constats</span>${esc(s.constats)}</div>`:''}
    ${s.actions.length?`
      <div style="font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Actions (${s.actions.length})</div>
      <div class="card" style="padding:0 14px">
        ${s.actions.map(a=>`<div class="ai"><span class="badge ${bc[a.resultat]||'bc'}" style="flex-shrink:0">${ic[a.resultat]||'…'}</span>
          <div style="flex:1"><div style="font-size:14px">${esc(a.texte)}</div>
          ${a.note?`<div style="font-size:12px;color:var(--tl);margin-top:2px">${esc(a.note)}</div>`:''}</div></div>`).join('')}
      </div>`:''}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-d btn-sm" style="flex:1" onclick="delSession('${s.id}')">Supprimer</button>
      <button class="btn btn-o" style="flex:1" onclick="closeModal();editSession('${s.id}')">✏️ Modifier</button>
      <button class="btn btn-p" style="flex:1" onclick="closeModal()">Fermer</button>
    </div>
  `);
}
function delSession(id) {
  if (!confirm('Supprimer cette session ?')) return;
  S.sessions = S.sessions.filter(s=>s.id!==id);
  save(); closeModal(); render(); snack('Session supprimée');
}

// =====================================================
// CULTURES
// =====================================================
function openNewCulture() {
  modal(`
    <div class="mo-handle"></div>
    <div class="mo-title">Nouvelle culture</div>
    ${cultureFormFields(null)}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-o" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" style="flex:2" onclick="saveCulture('')">Ajouter</button>
    </div>
  `);
}
function viewCulture(id) {
  const c = S.cultures.find(x=>x.id===id); if (!c) return;
  modal(`
    <div class="mo-handle"></div>
    <div class="mo-title">Modifier la culture</div>
    ${cultureFormFields(c)}
    <div style="font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 8px">Statut</div>
    <div class="rbts" style="margin-bottom:14px">
      <button class="rbt ${c.statut==='succes'?'rs':''}" data-v="succes" onclick="selR(this)">✓ Succès</button>
      <button class="rbt ${c.statut==='encours'?'rc':''}" data-v="encours" onclick="selR(this)">⚙ En cours</button>
      <button class="rbt ${c.statut==='echec'?'re':''}"  data-v="echec"  onclick="selR(this)">✗ Échec</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-d btn-sm" style="flex:1" onclick="delCulture('${c.id}')">Supprimer</button>
      <button class="btn btn-p" style="flex:2" onclick="saveCulture('${c.id}')">Enregistrer</button>
    </div>
  `);
}
function cultureFormFields(c) {
  return `
    <div class="fg"><label class="flabel">Nom</label>
      <input type="text" id="c-nom" class="fi" placeholder="ex: Tomates…" value="${esc(c?c.nom:'')}">
    </div>
    <div class="fg"><label class="flabel">Variété (optionnel)</label>
      <input type="text" id="c-var" class="fi" placeholder="ex: Marmande…" value="${esc(c?c.variete:'')}">
    </div>
    <div class="fg"><label class="flabel">Zone</label>
      <select id="c-zone" class="fi">${ZONES.map(z=>`<option ${c&&c.zone===z?'selected':''}>${esc(z)}</option>`).join('')}</select>
    </div>
    <div class="fg"><label class="flabel">Notes</label>
      <div style="display:flex;gap:8px">
        <textarea id="c-note" class="fi fta" style="flex:1" placeholder="Observations…">${esc(c?c.note:'')}</textarea>
        <button class="mic-btn" style="align-self:flex-start" onclick="voiceModal('c-note')">🎤</button>
      </div>
    </div>`;
}
function saveCulture(existingId) {
  const nom = document.getElementById('c-nom').value.trim();
  if (!nom) { snack('Renseigne le nom'); return; }
  const variete = document.getElementById('c-var').value.trim();
  const zone    = document.getElementById('c-zone').value;
  const note    = document.getElementById('c-note').value.trim();
  const rb      = document.querySelector('.rbts .rbt.rs,.rbts .rbt.rc,.rbts .rbt.re');
  const statut  = rb ? rb.dataset.v : 'encours';
  if (existingId) {
    const i = S.cultures.findIndex(x=>x.id===existingId);
    if (i>=0) S.cultures[i] = { ...S.cultures[i], nom, variete, zone, note, statut };
    snack('Culture mise à jour ✓');
  } else {
    S.cultures.push({ id:uid(), nom, variete, zone, note, statut });
    snack('Culture ajoutée ✓');
  }
  save(); closeModal(); render();
}
function delCulture(id) {
  if (!confirm('Supprimer cette culture ?')) return;
  S.cultures = S.cultures.filter(c=>c.id!==id);
  save(); closeModal(); render(); snack('Culture supprimée');
}

// =====================================================
// TODOS
// =====================================================
function openNewTodo() { todoForm(null); }
function editTodo(id, e) { e.stopPropagation(); const t = S.todos.find(x=>x.id===id); if(t) todoForm(t); }
function todoForm(t) {
  window._prio = t ? t.priorite : 'haute';
  modal(`
    <div class="mo-handle"></div>
    <div class="mo-title">${t?'Modifier la tâche':'Nouvelle tâche'}</div>
    <div class="fg"><label class="flabel">Tâche</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="t-txt" class="fi" style="flex:1" placeholder="Quoi faire ?" value="${esc(t?t.texte:'')}">
        <button class="mic-btn" onclick="voiceModal('t-txt')">🎤</button>
      </div>
    </div>
    <div class="fg"><label class="flabel">Période</label>
      <select id="t-sai" class="fi">${SAISONS.map(s=>`<option ${t&&t.saison===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="fg"><label class="flabel">Priorité</label>
      <div class="rbts">
        <button class="rbt ${window._prio==='haute'?'re':''}" id="pb-h" onclick="selPrio('haute')">🔴 Haute</button>
        <button class="rbt ${window._prio==='normale'?'rc':''}" id="pb-n" onclick="selPrio('normale')">⚪ Normale</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-o" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" style="flex:2" onclick="saveTodo('${t?t.id:''}')">${t?'Enregistrer':'Ajouter'}</button>
    </div>
  `);
}
function selPrio(p) {
  window._prio = p;
  document.getElementById('pb-h').className = 'rbt'+(p==='haute'?' re':'');
  document.getElementById('pb-n').className = 'rbt'+(p==='normale'?' rc':'');
}
function saveTodo(existingId) {
  const texte = document.getElementById('t-txt').value.trim();
  if (!texte) { snack('Renseigne la tâche'); return; }
  const saison   = document.getElementById('t-sai').value;
  const priorite = window._prio || 'normale';
  if (existingId) {
    const i = S.todos.findIndex(x=>x.id===existingId);
    if (i>=0) S.todos[i] = { ...S.todos[i], texte, saison, priorite };
    snack('Tâche modifiée ✓');
  } else {
    S.todos.push({ id:uid(), texte, saison, priorite, fait:false });
    snack('Tâche ajoutée ✓');
  }
  save(); closeModal(); render();
}
function toggleTodo(id) { const t = S.todos.find(x=>x.id===id); if(t) { t.fait=!t.fait; save(); render(); } }
function delTodo(id, e) { e.stopPropagation(); S.todos = S.todos.filter(t=>t.id!==id); save(); render(); }

// =====================================================
// MODAL ENGINE
// =====================================================
function modal(html) {
  closeModal();
  const ov  = document.createElement('div'); ov.className='mo'; ov.id='mo';
  ov.onclick = e => { if (e.target===ov) closeModal(); };
  const box = document.createElement('div'); box.className='mo-box'; box.innerHTML=html;
  ov.appendChild(box); document.body.appendChild(ov);
  setTimeout(() => { const fi=box.querySelector('input:not([type=date]),textarea'); if(fi) fi.focus(); }, 300);
}
function closeModal() { document.getElementById('mo')?.remove(); }

// =====================================================
// UTILS
// =====================================================
function fmtDate(d) {
  if (!d) return '';
  return new Date(d+'T12:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function fmtDateShort(d) {
  if (!d) return '';
  return new Date(d+'T12:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function snack(msg) {
  const el = document.getElementById('snack');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(snack._t); snack._t = setTimeout(()=>{ el.style.display='none'; }, 2600);
}

// =====================================================
// INIT
// =====================================================
load(); render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
