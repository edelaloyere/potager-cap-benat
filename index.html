<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Potager">
  <meta name="theme-color" content="#2E7D32">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Mon Potager — Cap Bénat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --g-dark:#2E7D32; --g-mid:#388E3C; --g-pale:#E8F5E9; --g-bg:#F1F8E9;
      --text:#212121; --tl:#757575; --white:#fff;
      --nav-h:60px; --hdr-h:58px;
      --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    }
    html,body { height:100%; width:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif; background:var(--g-bg); color:var(--text); -webkit-font-smoothing:antialiased; }
    #app { display:flex; flex-direction:column; height:100dvh; }

    /* HEADER */
    .hdr { background:var(--g-dark); color:white; padding:0 14px; padding-top:var(--safe-t); height:calc(var(--hdr-h) + var(--safe-t)); display:flex; align-items:flex-end; padding-bottom:10px; justify-content:space-between; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.25); }
    .hdr-left h1 { font-size:18px; font-weight:700; }
    .hdr-left p  { font-size:11px; opacity:.75; margin-top:1px; }
    .hdr-right { display:flex; gap:8px; align-items:center; }
    .hdr-btn { background:rgba(255,255,255,.18); border:none; color:white; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
    .hdr-btn.active { background:rgba(255,255,255,.35); }

    /* MAIN */
    #main { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; padding-bottom:calc(var(--nav-h) + var(--safe-b) + 80px); }

    /* BOTTOM NAV */
    .bnav { position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b); background:white; border-top:1px solid #E0E0E0; display:flex; box-shadow:0 -2px 10px rgba(0,0,0,.08); z-index:100; }
    .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:#9E9E9E; border:none; background:none; font-size:10px; font-weight:500; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:color .15s; }
    .nav-btn svg { width:23px; height:23px; }
    .nav-btn.on { color:var(--g-dark); }

    /* FAB */
    .fab { position:fixed; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); right:18px; width:54px; height:54px; background:var(--g-dark); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.28); border:none; cursor:pointer; z-index:90; -webkit-tap-highlight-color:transparent; }
    .fab svg { color:white; width:27px; height:27px; }

    /* CARDS */
    .card { background:white; border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 5px rgba(0,0,0,.07); }
    .card-row { display:flex; justify-content:space-between; align-items:flex-start; }

    /* BADGES */
    .badge { display:inline-flex; align-items:center; gap:3px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
    .bs { background:#E8F5E9; color:#2E7D32; } .bm { background:#FFF3E0; color:#E65100; }
    .be { background:#FFEBEE; color:#C62828; } .bc { background:#E3F2FD; color:#1565C0; }
    .bz { background:#F3E5F5; color:#6A1B9A; font-size:10px; }

    /* SECTION TITLE */
    .stitle { font-size:11px; font-weight:700; color:var(--tl); text-transform:uppercase; letter-spacing:.9px; margin:18px 0 8px; }
    .stitle:first-child { margin-top:0; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 18px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .btn-p { background:var(--g-dark); color:white; }
    .btn-o { background:transparent; border:1.5px solid var(--g-dark); color:var(--g-dark); }
    .btn-d { background:transparent; border:1.5px solid #C62828; color:#C62828; font-size:13px; padding:8px 14px; }
    .btn-sm { padding:7px 13px; font-size:13px; }
    .icon-btn { background:none; border:none; cursor:pointer; padding:6px; color:var(--tl); -webkit-tap-highlight-color:transparent; display:flex; align-items:center; }

    /* MODAL */
    .mo { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; display:flex; align-items:flex-end; }
    .mo-box { background:white; border-radius:22px 22px 0 0; width:100%; max-height:94dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 18px 32px; padding-bottom:calc(32px + var(--safe-b)); animation:slideUp .28s cubic-bezier(.4,0,.2,1); }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .mo-handle { width:38px; height:4px; background:#DDD; border-radius:2px; margin:14px auto 18px; }
    .mo-title { font-size:21px; font-weight:700; color:var(--g-dark); margin-bottom:18px; }

    /* FORM */
    .fg { margin-bottom:14px; }
    .flabel { display:block; font-size:12px; font-weight:700; color:var(--tl); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
    .fi { width:100%; padding:12px 13px; border:1.5px solid #E0E0E0; border-radius:10px; font-size:16px; font-family:inherit; color:var(--text); background:white; -webkit-appearance:none; }
    .fi:focus { outline:none; border-color:var(--g-dark); }
    .fta { resize:vertical; min-height:78px; }

    /* ZONE PILLS */
    .zpills { display:flex; flex-wrap:wrap; gap:8px; }
    .zpill { padding:8px 13px; border-radius:20px; border:1.5px solid #E0E0E0; font-size:13px; cursor:pointer; background:white; color:var(--text); -webkit-tap-highlight-color:transparent; }
    .zpill.on { background:var(--g-dark); color:white; border-color:var(--g-dark); }

    /* RESULT BTNS */
    .rbts { display:flex; gap:6px; }
    .rbt { flex:1; padding:9px 4px; border-radius:8px; border:1.5px solid #E0E0E0; font-size:12px; font-weight:600; text-align:center; cursor:pointer; background:white; -webkit-tap-highlight-color:transparent; }
    .rs{background:#E8F5E9;border-color:#43A047;color:#2E7D32} .rm{background:#FFF3E0;border-color:#FF8F00;color:#E65100}
    .re{background:#FFEBEE;border-color:#EF5350;color:#C62828} .rc{background:#E3F2FD;border-color:#42A5F5;color:#1565C0}

    /* MÉTÉO */
    .mbts { display:flex; gap:8px; }
    .mbt { flex:1; padding:10px; border-radius:10px; border:1.5px solid #E0E0E0; font-size:22px; text-align:center; cursor:pointer; background:white; -webkit-tap-highlight-color:transparent; }
    .mbt.on { border-color:var(--g-dark); background:var(--g-pale); }

    /* ACTION ENTRY */
    .ae { background:var(--g-bg); border-radius:10px; padding:12px; margin-bottom:8px; }
    .ae-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .add-act { width:100%; padding:12px; border:2px dashed #BDBDBD; border-radius:10px; background:transparent; color:var(--tl); font-size:15px; cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent; }

    /* JOURNAL */
    .s-date { font-size:12px; color:var(--tl); font-weight:600; }
    .s-title { font-size:16px; font-weight:700; margin:3px 0 5px; }
    .s-prev { font-size:13px; color:var(--tl); line-height:1.4; }
    .s-zones { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .ai { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #F5F5F5; }
    .ai:last-child { border-bottom:none; }

    /* CULTURES */
    .cgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .cc { background:white; border-radius:12px; padding:13px; box-shadow:0 1px 5px rgba(0,0,0,.07); cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .cc-name { font-size:15px; font-weight:700; margin-bottom:3px; }
    .cc-sub  { font-size:11px; color:var(--tl); margin-bottom:7px; line-height:1.3; }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
    .ds{background:#43A047} .dc{background:#42A5F5} .de{background:#EF5350} .da{background:#BDBDBD}

    /* FILTER BAR */
    .fbar { display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; margin-bottom:12px; }
    .fbar::-webkit-scrollbar { display:none; }
    .fc { flex-shrink:0; padding:7px 13px; border-radius:20px; border:1.5px solid #E0E0E0; font-size:13px; cursor:pointer; background:white; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
    .fc.on { background:var(--g-dark); color:white; border-color:var(--g-dark); }

    /* TODO */
    .ti { display:flex; align-items:center; gap:11px; padding:13px 0; border-bottom:1px solid #F5F5F5; }
    .ti:last-child { border-bottom:none; }
    .tck { width:24px; height:24px; border-radius:7px; border:2px solid #BDBDBD; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
    .tck.on { background:var(--g-dark); border-color:var(--g-dark); }
    .ttxt { flex:1; font-size:15px; line-height:1.35; }
    .ttxt.done { text-decoration:line-through; color:var(--tl); }
    .ti-actions { display:flex; gap:2px; flex-shrink:0; }

    /* PLANNING */
    .mc { background:white; border-radius:14px; margin-bottom:10px; overflow:hidden; box-shadow:0 1px 5px rgba(0,0,0,.07); }
    .mc-hdr { background:var(--g-dark); color:white; padding:12px 15px; font-weight:700; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
    .mc.now .mc-hdr { background:#43A047; }
    .mc-now-tag { font-size:11px; font-weight:600; background:rgba(255,255,255,.2); padding:2px 8px; border-radius:10px; }
    .mc-body { padding:10px 15px; }
    .mt { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid #F8F8F8; font-size:14px; }
    .mt:last-child { border-bottom:none; }
    .mt-ico { font-size:17px; flex-shrink:0; }

    /* PLANNING EDIT MODE */
    .plan-edit-banner { background:#FFF3E0; border-radius:12px; padding:12px 14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
    .plan-edit-banner span { font-size:14px; font-weight:600; color:#E65100; }
    .mc-edit-hdr { display:flex; gap:8px; align-items:center; width:100%; }
    .mc-edit-ico { width:42px; padding:6px; border:1.5px solid rgba(255,255,255,.5); border-radius:8px; background:rgba(255,255,255,.15); color:white; font-size:18px; text-align:center; -webkit-appearance:none; }
    .mc-edit-lbl { flex:1; padding:6px 10px; border:1.5px solid rgba(255,255,255,.5); border-radius:8px; background:rgba(255,255,255,.15); color:white; font-size:14px; font-weight:600; -webkit-appearance:none; }
    .mc-edit-ico::placeholder,.mc-edit-lbl::placeholder { color:rgba(255,255,255,.6); }
    .mt-edit { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #F0F0F0; }
    .mt-edit:last-child { border-bottom:none; }
    .mt-edit-ico { width:38px; padding:7px 4px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:16px; text-align:center; background:white; -webkit-appearance:none; }
    .mt-edit-txt { flex:1; padding:8px 10px; border:1.5px solid #E0E0E0; border-radius:8px; font-size:14px; font-family:inherit; background:white; -webkit-appearance:none; }
    .del-icon-btn { background:none; border:none; color:#EF5350; cursor:pointer; padding:6px; font-size:18px; flex-shrink:0; -webkit-tap-highlight-color:transparent; }
    .add-plan-task { width:100%; margin-top:8px; padding:10px; border:2px dashed #BDBDBD; border-radius:8px; background:transparent; color:var(--tl); font-size:13px; cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent; }
    .add-plan-block { width:100%; padding:13px; border:2px dashed var(--g-dark); border-radius:12px; background:transparent; color:var(--g-dark); font-size:15px; font-weight:600; cursor:pointer; text-align:center; margin-bottom:12px; -webkit-tap-highlight-color:transparent; }
    .del-block-btn { background:rgba(255,255,255,.2); border:none; color:white; border-radius:8px; padding:5px 10px; font-size:13px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }

    /* CONSTAT BOX */
    .constat-box { background:var(--g-pale); border-radius:10px; padding:13px; margin-bottom:14px; font-size:14px; line-height:1.65; white-space:pre-line; }

    /* EMPTY */
    .empty { text-align:center; padding:50px 20px; color:var(--tl); }
    .empty-ico { font-size:46px; margin-bottom:12px; }

    /* SNACKBAR */
    .snack { position:fixed; bottom:calc(var(--nav-h) + var(--safe-b) + 14px); left:14px; right:14px; background:#323232; color:white; padding:13px 15px; border-radius:10px; font-size:14px; z-index:500; display:none; animation:fadeUp .25s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-left">
      <h1 id="hdr-title">Mon Potager</h1>
      <p id="hdr-sub">Cap Bénat — Bormes-les-Mimosas</p>
    </div>
    <div class="hdr-right" id="hdr-right"></div>
  </div>
  <div id="main"></div>
  <nav class="bnav">
    <button class="nav-btn on" id="btn-journal" onclick="go('journal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 10h16M4 14h10"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Journal
    </button>
    <button class="nav-btn" id="btn-planning" onclick="go('planning')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Planning
    </button>
    <button class="nav-btn" id="btn-cultures" onclick="go('cultures')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V12M12 12C12 7 7 5 3 7M12 12C12 7 17 5 21 7"/></svg>Cultures
    </button>
    <button class="nav-btn" id="btn-todos" onclick="go('todos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>À faire
    </button>
  </nav>
</div>
<div class="snack" id="snack"></div>

<script>
// =====================================================
// STATE
// =====================================================
const S = { tab:'journal', sessions:[], todos:[], cultures:[], planning:[], cFilter:'Tous', planEdit:false };
const ZONES  = ['Restanque','Zone vignes','Près cuisine','Zone piscine','Devant maison','Contrebas restanque','Trépieds','Diverses'];
const SAISONS= ['Prochain passage','Printemps','Été','Automne','Hiver'];

function save() {
  localStorage.setItem('potager_v3', JSON.stringify({ sessions:S.sessions, todos:S.todos, cultures:S.cultures, planning:S.planning }));
}
function load() {
  const raw = localStorage.getItem('potager_v3');
  if (raw) {
    try { const d=JSON.parse(raw); S.sessions=d.sessions||[]; S.todos=d.todos||[]; S.cultures=d.cultures||[]; S.planning=d.planning||[]; if(!S.planning.length) S.planning=defaultPlanning(); }
    catch(e) { initData(); }
  } else { initData(); }
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// =====================================================
// DEFAULT PLANNING DATA
// =====================================================
function defaultPlanning() {
  return [
    { id:uid(), ico:'☀️', label:'Mai — Juin', months:[4,5], tasks:[
      {id:uid(),ico:'💧',texte:"Arroser régulièrement (sécheresse)"},
      {id:uid(),ico:'🐛',texte:"Surveiller piérides sur les choux cabus"},
      {id:uid(),ico:'🌱',texte:"Butter et tuteurer les courgettes au fur et à mesure"},
      {id:uid(),ico:'✂️',texte:"Tailler kiwis si croissance excessive"},
      {id:uid(),ico:'🥗',texte:"Première récolte : poireaux, choux, carottes"},
      {id:uid(),ico:'🪣',texte:"Retourner le composteur"},
    ]},
    { id:uid(), ico:'🌡️', label:'Juillet — Août', months:[6,7], tasks:[
      {id:uid(),ico:'💧',texte:"Arrosage intensif quotidien"},
      {id:uid(),ico:'🍅',texte:"Récoltes : tomates, aubergines, courgettes, concombres"},
      {id:uid(),ico:'🌿',texte:"Paillage épais pour retenir l'humidité"},
      {id:uid(),ico:'🔧',texte:"Installer goutte-à-goutte zone vignes"},
      {id:uid(),ico:'🥬',texte:"Semer chicorées et mâches pour automne (en barquette)"},
    ]},
    { id:uid(), ico:'🍂', label:'Septembre — Octobre', months:[8,9], tasks:[
      {id:uid(),ico:'🌱',texte:"Semer fèves dans la restanque (+ effaroucheur lapins)"},
      {id:uid(),ico:'🌱',texte:"Semer pois dans la restanque (treillis)"},
      {id:uid(),ico:'🌱',texte:"Resemer roquette sauvage"},
      {id:uid(),ico:'🌿',texte:"Pailler toutes les zones (priorité restanque)"},
      {id:uid(),ico:'📦',texte:"Constituer stock de paillage pour l'hiver"},
      {id:uid(),ico:'🌱',texte:"Semer épinards + mâche"},
      {id:uid(),ico:'💪',texte:"Amender sol muret avec compost"},
      {id:uid(),ico:'🧹',texte:"Retirer les plants d'été finissants"},
    ]},
    { id:uid(), ico:'❄️', label:'Novembre — Décembre', months:[10,11], tasks:[
      {id:uid(),ico:'🌱',texte:"Planter ail et échalotes"},
      {id:uid(),ico:'🪣',texte:"Retourner le compost"},
      {id:uid(),ico:'🌿',texte:"Protéger kiwis si risque de gel"},
      {id:uid(),ico:'📋',texte:"Bilan annuel + plan pour l'an prochain"},
      {id:uid(),ico:'🛒',texte:"Commander les graines du printemps"},
    ]},
    { id:uid(), ico:'🌧️', label:'Janvier — Février', months:[0,1], tasks:[
      {id:uid(),ico:'🌱',texte:"Semer choux cabus en barquette à Aix"},
      {id:uid(),ico:'🌱',texte:"Semer poireaux en barquette à Aix"},
      {id:uid(),ico:'💊',texte:"Apport engrais clémentiniers + avocatier"},
      {id:uid(),ico:'📦',texte:"Utiliser les stocks de paillage"},
      {id:uid(),ico:'✂️',texte:"Taille hivernale si nécessaire"},
    ]},
    { id:uid(), ico:'🌸', label:'Mars — Avril', months:[2,3], tasks:[
      {id:uid(),ico:'🌱',texte:"Mars : semer carottes + cosmos + capucines (restanque)"},
      {id:uid(),ico:'🥔',texte:"Mars : planter pommes de terre (contrebas restanque, BRF 10cm)"},
      {id:uid(),ico:'🥬',texte:"Mars : planter 50 poireaux (restanque, 2 rangs)"},
      {id:uid(),ico:'🛒',texte:"Avril : Foire aux plants de La Londe (tomates, aubergines…)"},
      {id:uid(),ico:'🍅',texte:"Avril : planter tomates + aubergines dans la restanque"},
      {id:uid(),ico:'🌿',texte:"Aromatiques cuisine (persil, ciboulette, thym — PAS basilic avant mi-avril)"},
      {id:uid(),ico:'🔧',texte:"Installer trépieds pour concombres"},
      {id:uid(),ico:'⚠️',texte:"Attendre mi-avril pour basilic + concombres (10°C min continu)"},
    ]},
  ];
}

// =====================================================
// INITIAL DATA
// =====================================================
function initData() {
  S.planning = defaultPlanning();
  S.sessions = [
    { id:uid(), date:'2026-04-18', meteo:'☀️', zones:['Restanque','Zone vignes','Devant maison'],
      constats:`Enseignements majeurs (bilan de saison) :

1. La terre paillée à l'automne est excellente vs non paillée. La restanque (mi-ombre + paillage) = zone star. Il faut impérativement pailler avant de cultiver. Attention au muret : très peu de soleil, sol dur.

2. Tout ce qui est hors restanque = échec (sécheresse + dormance des vignes). Oublier la zone vignes tant qu'il n'y aura pas de goutte-à-goutte. Les pommes de terre sont une exception.

3. Privilégier les repiquages en avril à la Foire aux plants de La Londe plutôt que les semis aléatoires avant (surtout sans goutte-à-goutte).

4. Succès imprévu des aromatiques près de la cuisine (bénéficient de l'arrosage auto du voisin).

5. Réserve de paillage près des tennis = vide → faire des stocks pendant l'hiver.

6. Tant que la terre ne sera pas parfaite, privilégier les plants aux semis (laitues, épinards). Ou semer en barquette à Aix.`,
      actions:[
        {id:uid(),texte:"Arrosages toutes zones + 10% urée",resultat:'succes'},

// =====================================================
// NAVIGATION
// =====================================================
function go(tab) {
  S.tab=tab; S.planEdit=false;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('btn-'+tab).classList.add('on');
  render();
}

// =====================================================
// RENDER
// =====================================================
function render() {
  const main=document.getElementById('main');
  document.querySelector('.fab')?.remove();
  const titles={journal:'Mon Potager',planning:'Planning saisonnier',cultures:'Mes cultures',todos:'À faire'};
  const subs={journal:'Cap Bénat — Bormes-les-Mimosas',planning:'Tâches mois par mois',cultures:S.cultures.length+' cultures suivies',todos:S.todos.filter(t=>!t.fait).length+' tâche(s) en attente'};
  document.getElementById('hdr-title').textContent=titles[S.tab];
  document.getElementById('hdr-sub').textContent=subs[S.tab];
  document.getElementById('hdr-right').innerHTML=hdrButtons();
  switch(S.tab){
    case 'journal':  main.innerHTML=renderJournal();  addFab(openNewSession); break;
    case 'planning': main.innerHTML=renderPlanning(); break;
    case 'cultures': main.innerHTML=renderCultures(); addFab(openNewCulture); break;
    case 'todos':    main.innerHTML=renderTodos();    addFab(openNewTodo); break;
  }
}
function hdrButtons() {
  if(S.tab==='planning') {
    return S.planEdit
      ? `<button class="hdr-btn active" onclick="S.planEdit=false;save();render()">✓ Terminer</button>`
      : `<button class="hdr-btn" onclick="S.planEdit=true;render()">✏️ Modifier</button>`;
  }
  return '';
}
function addFab(fn){
  const b=document.createElement('button');b.className='fab';
  b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
  b.onclick=fn; document.getElementById('app').appendChild(b);
}

// =====================================================
// JOURNAL
// =====================================================
function renderJournal(){
  if(!S.sessions.length) return `<div class="empty"><div class="empty-ico">🌱</div><p>Aucune session.<br>Appuie sur + pour commencer.</p></div>`;
  return [...S.sessions].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>{
    const ns=s.actions.filter(a=>a.resultat==='succes').length;
    const nm=s.actions.filter(a=>a.resultat==='mitige').length;
    const ne=s.actions.filter(a=>a.resultat==='echec').length;
    const nc=s.actions.filter(a=>!a.resultat||a.resultat==='encours').length;
    const prev=s.constats?s.constats.replace(/\n/g,' ').substring(0,90)+'…':s.actions.length+' action(s)';
    return `<div class="card" onclick="viewSession('${s.id}')">
      <div class="card-row">
        <div><div class="s-date">${s.meteo||''} ${fmtDate(s.date)}</div>
          <div class="s-title">${s.actions.length} action${s.actions.length>1?'s':''}</div></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:140px">
          ${ns?`<span class="badge bs">✓ ${ns}</span>`:''}${nm?`<span class="badge bm">~ ${nm}</span>`:''}
          ${ne?`<span class="badge be">✗ ${ne}</span>`:''}${nc?`<span class="badge bc">… ${nc}</span>`:''}
        </div>
      </div>
      <div class="s-prev">${esc(prev)}</div>
      <div class="s-zones">${[...new Set(s.zones)].map(z=>`<span class="badge bz">${z}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

// PLANNING
// =====================================================
function renderPlanning(){
  const m=new Date().getMonth();
  let html='';
  if(S.planEdit){
    html+=`<div class="plan-edit-banner"><span>✏️ Mode édition actif</span><button class="btn btn-sm btn-p" onclick="S.planEdit=false;save();render()">✓ Terminer</button></div>`;
  }
  S.planning.forEach((b,bi)=>{
    const now=b.months&&b.months.includes(m);
    if(S.planEdit){
      html+=`<div class="mc ${now?'now':''}">
        <div class="mc-hdr">
          <div class="mc-edit-hdr">
            <input class="mc-edit-ico" value="${esc(b.ico)}" oninput="updPIco(${bi},this.value)" maxlength="4">
            <input class="mc-edit-lbl" value="${esc(b.label)}" oninput="updPLabel(${bi},this.value)">
            <button class="del-block-btn" onclick="delPBlock(${bi})">✕ Supprimer</button>
          </div>
        </div>
        <div class="mc-body">
          ${b.tasks.map((t,ti)=>`
            <div class="mt-edit">
              <input class="mt-edit-ico" value="${esc(t.ico)}" oninput="updPTIco(${bi},${ti},this.value)" maxlength="4">
              <input class="mt-edit-txt" value="${esc(t.texte)}" oninput="updPTask(${bi},${ti},this.value)">
              <button class="del-icon-btn" onclick="delPTask(${bi},${ti})">✕</button>
            </div>`).join('')}
          <button class="add-plan-task" onclick="addPTask(${bi})">+ Ajouter une tâche</button>
        </div>
      </div>`;
    } else {
      html+=`<div class="mc ${now?'now':''}">
        <div class="mc-hdr">
          <span>${esc(b.ico)} ${esc(b.label)}</span>
          ${now?`<span class="mc-now-tag">← Maintenant</span>`:''}
        </div>
        <div class="mc-body">
          ${b.tasks.map(t=>`<div class="mt"><span class="mt-ico">${esc(t.ico)}</span><span>${esc(t.texte)}</span></div>`).join('')}
        </div>
      </div>`;
    }
  });
  if(S.planEdit){
    html+=`<button class="add-plan-block" onclick="addPBlock()">+ Ajouter un bloc mensuel</button>`;
  }
  return html;
}
// Planning edit functions
function updPIco(bi,v){S.planning[bi].ico=v;}
function updPLabel(bi,v){S.planning[bi].label=v;}
function updPTIco(bi,ti,v){S.planning[bi].tasks[ti].ico=v;}
function updPTask(bi,ti,v){S.planning[bi].tasks[ti].texte=v;}
function delPTask(bi,ti){S.planning[bi].tasks.splice(ti,1);save();render();}
function addPTask(bi){S.planning[bi].tasks.push({id:uid(),ico:'📌',texte:'Nouvelle tâche'});save();render();}
function delPBlock(bi){if(!confirm('Supprimer ce bloc ?'))return;S.planning.splice(bi,1);save();render();}
function addPBlock(){S.planning.push({id:uid(),ico:'📅',label:'Nouveau bloc',months:[],tasks:[{id:uid(),ico:'📌',texte:'Nouvelle tâche'}]});save();render();}

      </div>`).join('')}
    </div>`;
}
function setCF(z){S.cFilter=z;render();}

// =====================================================
// TODOS
// =====================================================
function renderTodos(){
  const rem=S.todos.filter(t=>!t.fait);
  const done=S.todos.filter(t=>t.fait);
  let html='';
  SAISONS.forEach(s=>{
    const items=rem.filter(t=>t.saison===s);
    if(!items.length)return;
    html+=`<div class="stitle">${s}</div><div class="card" style="padding:0 14px">${items.map(renderTI).join('')}</div>`;
  });
  const other=rem.filter(t=>!SAISONS.includes(t.saison));
  if(other.length) html+=`<div class="stitle">Autres</div><div class="card" style="padding:0 14px">${other.map(renderTI).join('')}</div>`;
  if(done.length) html+=`<div class="stitle">Terminé (${done.length})</div><div class="card" style="padding:0 14px;opacity:.55">${done.map(renderTI).join('')}</div>`;
  return html||`<div class="empty"><div class="empty-ico">✅</div><p>Tout est fait !</p></div>`;
}
function renderTI(t){
  return `<div class="ti">
    <div class="tck ${t.fait?'on':''}" onclick="toggleTodo('${t.id}')">
      ${t.fait?`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`:''}
    </div>
    <div class="ttxt ${t.fait?'done':''}">${t.priorite==='haute'&&!t.fait?'🔴 ':''}${esc(t.texte)}</div>
    <div class="ti-actions">
      <button class="icon-btn" onclick="editTodo('${t.id}',event)" title="Modifier">

      </button>
      <button class="icon-btn" onclick="delTodo('${t.id}',event)" title="Supprimer">

    <div class="ae-hdr">
      <span style="font-size:12px;font-weight:700;color:var(--tl)">Action ${_acIdx}</span>
      <button onclick="document.getElementById('${id}').remove()" style="border:none;background:none;font-size:18px;color:#999;cursor:pointer">✕</button>
    </div>
    <input type="text" class="fi act-txt" placeholder="Décris l'action..." value="${esc(a?a.texte:'')}" style="margin-bottom:8px">
    <div class="rbts">
      <button class="rbt ${a&&a.resultat==='succes'?'rs':''}" data-v="succes" onclick="selR(this)">✓ Succès</button>
      <button class="rbt ${a&&a.resultat==='mitige'?'rm':''}" data-v="mitige" onclick="selR(this)">~ Mitigé</button>
      <button class="rbt ${a&&a.resultat==='echec'?'re':''}" data-v="echec"  onclick="selR(this)">✗ Échec</button>
      <button class="rbt ${a&&a.resultat==='encours'?'rc':''}" data-v="encours" onclick="selR(this)">… En cours</button>
    </div>
  </div>`;
}
function openNewSession(){sessionForm(null);}
function editSession(id){const s=S.sessions.find(x=>x.id===id);if(s)sessionForm(s);}
function addAct(){const d=document.createElement('div');d.outerHTML;document.getElementById('f-actions').insertAdjacentHTML('beforeend',actionField(null));}
function selM(b){document.querySelectorAll('.mbt').forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function selR(b){
  const map={succes:'rs',mitige:'rm',echec:'re',encours:'rc'};
  b.closest('.rbts').querySelectorAll('.rbt').forEach(x=>{x.className='rbt';});
  b.classList.add(map[b.dataset.v]);
}
function saveSession(existingId){
  const date=document.getElementById('f-date').value;
  if(!date){snack('Renseigne la date');return;}
  const meteo=document.querySelector('.mbt.on')?.dataset.m||'';
  const zones=[...document.querySelectorAll('.zpill.on')].map(z=>z.dataset.z);
  const constats=document.getElementById('f-constats').value.trim();
  const actions=[...document.querySelectorAll('.ae')].map(e=>{
    const txt=e.querySelector('.act-txt').value.trim();
    const rb=e.querySelector('.rbt.rs,.rbt.rm,.rbt.re,.rbt.rc');
    const res=rb?rb.dataset.v:'encours';
    return txt?{id:uid(),texte:txt,resultat:res}:null;
  }).filter(Boolean);
  if(existingId){
    const i=S.sessions.findIndex(x=>x.id===existingId);
    if(i>=0) S.sessions[i]={...S.sessions[i],date,meteo,zones,constats,actions};
    snack('Session modifiée ✓');
  } else {
    S.sessions.push({id:uid(),date,meteo,zones,constats,actions});
    snack('Session enregistrée ✓');
  }
  save();closeModal();render();
}

// =====================================================
// SESSION — VIEW
// =====================================================
function viewSession(id){
  const s=S.sessions.find(x=>x.id===id);if(!s)return;
  const ic={succes:'✓',mitige:'~',echec:'✗',encours:'…'};
  const bc={succes:'bs',mitige:'bm',echec:'be',encours:'bc'};
  modal(`
    <div class="mo-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
      <div>
        <div style="font-size:22px;font-weight:800;color:var(--g-dark)">${esc(s.meteo)||''} ${fmtDate(s.date)}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${[...new Set(s.zones)].map(z=>`<span class="badge bz">${esc(z)}</span>`).join('')}</div>
      </div>
    </div>
    ${s.constats?`<div class="constat-box"><span style="font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:6px">Constats</span>${esc(s.constats)}</div>`:''}
    ${s.actions.length?`
      <div style="font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Actions (${s.actions.length})</div>
      <div class="card" style="padding:0 14px">
        ${s.actions.map(a=>`<div class="ai"><span class="badge ${bc[a.resultat]||'bc'}" style="flex-shrink:0">${ic[a.resultat]||'…'}</span>
          <div style="flex:1"><div style="font-size:14px">${esc(a.texte)}</div>
          ${a.note?`<div style="font-size:12px;color:var(--tl);margin-top:2px">${esc(a.note)}</div>`:''}</div></div>`).join('')}
      </div>`:''}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-d btn-sm" style="flex:1" onclick="delSession('${s.id}')">Supprimer</button>
      <button class="btn btn-o" style="flex:1" onclick="closeModal();editSession('${s.id}')">✏️ Modifier</button>
      <button class="btn btn-p" style="flex:1" onclick="closeModal()">Fermer</button>
    </div>
  `);
}
function delSession(id){
  if(!confirm('Supprimer cette session ?'))return;
  S.sessions=S.sessions.filter(s=>s.id!==id);
  save();closeModal();render();snack('Session supprimée');
}

// =====================================================
// CULTURES — NEW / VIEW+EDIT
// =====================================================
function openNewCulture(){
  modal(`
    <div class="mo-handle"></div>
    <div class="mo-title">Nouvelle culture</div>
    ${cultureFormFields(null)}
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-o" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" style="flex:2" onclick="saveCulture('')">Ajouter</button>
    </div>
  `);
}
function viewCulture(id){
  const c=S.cultures.find(x=>x.id===id);if(!c)return;
  modal(`
    <div class="mo-handle"></div>
    <div class="mo-title">Modifier la culture</div>
    ${cultureFormFields(c)}
    <div style="font-size:11px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 8px">Statut</div>
    <div class="rbts" style="margin-bottom:14px">
      <button class="rbt ${c.statut==='succes'?'rs':''}" data-v="succes" onclick="selR(this)">✓ Succès</button>
      <button class="rbt ${c.statut==='encours'?'rc':''}" data-v="encours" onclick="selR(this)">⚙ En cours</button>
      <button class="rbt ${c.statut==='echec'?'re':''}" data-v="echec"  onclick="selR(this)">✗ Échec</button>
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button class="btn btn-d btn-sm" style="flex:1" onclick="delCulture('${c.id}')">Supprimer</button>
      <button class="btn btn-p" style="flex:2" onclick="saveCulture('${c.id}')">Enregistrer</button>
    </div>
  `);
}
function cultureFormFields(c){
  const rb=(v)=>`<button class="rbt ${c&&c.statut===v?({succes:'rs',encours:'rc',echec:'re'}[v]):''}">`;
  return `
    <div class="fg"><label class="flabel">Nom</label>
      <input type="text" id="c-nom" class="fi" placeholder="ex: Tomates, Haricots…" value="${esc(c?c.nom:'')}">
    </div>
    <div class="fg"><label class="flabel">Variété (optionnel)</label>
      <input type="text" id="c-var" class="fi" placeholder="ex: Nantes, Marmande…" value="${esc(c?c.variete:'')}">
    </div>
    <div class="fg"><label class="flabel">Zone</label>
      <select id="c-zone" class="fi">${ZONES.map(z=>`<option ${c&&c.zone===z?'selected':''}>${esc(z)}</option>`).join('')}</select>
    </div>
    <div class="fg"><label class="flabel">Notes</label>
      <textarea id="c-note" class="fi fta" placeholder="Observations, conseils…">${esc(c?c.note:'')}</textarea>
    </div>`;
}
function saveCulture(existingId){
  const nom=document.getElementById('c-nom').value.trim();
  if(!nom){snack('Renseigne le nom');return;}
  const variete=document.getElementById('c-var').value.trim();
  const zone=document.getElementById('c-zone').value;
  const note=document.getElementById('c-note').value.trim();
  const rb=document.querySelector('.rbts .rbt.rs,.rbts .rbt.rm,.rbts .rbt.re,.rbts .rbt.rc');
  const statut=rb?rb.dataset.v:'encours';
  if(existingId){
    const i=S.cultures.findIndex(x=>x.id===existingId);
    if(i>=0) S.cultures[i]={...S.cultures[i],nom,variete,zone,note,statut};
    snack('Culture mise à jour ✓');
  } else {
    S.cultures.push({id:uid(),nom,variete,zone,note,statut});
    snack('Culture ajoutée ✓');
  }
  save();closeModal();render();
}
function delCulture(id){
  if(!confirm('Supprimer cette culture ?'))return;
  S.cultures=S.cultures.filter(c=>c.id!==id);
  save();closeModal();render();snack('Culture supprimée');
}

// =====================================================
// TODOS — NEW / EDIT
// =====================================================
function openNewTodo(){todoForm(null);}
function editTodo(id,e){e.stopPropagation();const t=S.todos.find(x=>x.id===id);if(t)todoForm(t);}
function todoForm(t){
  window._prio=t?t.priorite:'haute';
  modal(`
    <div class="mo-handle"></div>
    <div class="mo-title">${t?'Modifier la tâche':'Nouvelle tâche'}</div>
    <div class="fg"><label class="flabel">Tâche</label>
      <input type="text" id="t-txt" class="fi" placeholder="Quoi faire ?" value="${esc(t?t.texte:'')}">
    </div>
    <div class="fg"><label class="flabel">Période</label>
      <select id="t-sai" class="fi">${SAISONS.map(s=>`<option ${t&&t.saison===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="fg"><label class="flabel">Priorité</label>
      <div class="rbts">
        <button class="rbt ${window._prio==='haute'?'re':''}" id="pb-h" onclick="selPrio('haute')">🔴 Haute</button>
        <button class="rbt ${window._prio==='normale'?'rc':''}" id="pb-n" onclick="selPrio('normale')">⚪ Normale</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-o" style="flex:1" onclick="closeModal()">Annuler</button>
      <button class="btn btn-p" style="flex:2" onclick="saveTodo('${t?t.id:''}')">
        ${t?'Enregistrer':'Ajouter'}
      </button>
    </div>
  `);
}
function selPrio(p){
  window._prio=p;
  document.getElementById('pb-h').className='rbt'+(p==='haute'?' re':'');
  document.getElementById('pb-n').className='rbt'+(p==='normale'?' rc':'');
}
function saveTodo(existingId){
  const texte=document.getElementById('t-txt').value.trim();
  if(!texte){snack('Renseigne la tâche');return;}
  const saison=document.getElementById('t-sai').value;
  const priorite=window._prio||'normale';
  if(existingId){
    const i=S.todos.findIndex(x=>x.id===existingId);
    if(i>=0) S.todos[i]={...S.todos[i],texte,saison,priorite};
    snack('Tâche modifiée ✓');
  } else {
    S.todos.push({id:uid(),texte,saison,priorite,fait:false});
    snack('Tâche ajoutée ✓');
  }
  save();closeModal();render();
}
function toggleTodo(id){const t=S.todos.find(x=>x.id===id);if(t){t.fait=!t.fait;save();render();}}
function delTodo(id,e){e.stopPropagation();S.todos=S.todos.filter(t=>t.id!==id);save();render();}

// =====================================================
// MODAL ENGINE
// =====================================================
function modal(html){
  closeModal();
  const ov=document.createElement('div');ov.className='mo';ov.id='mo';
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  const box=document.createElement('div');box.className='mo-box';box.innerHTML=html;
  ov.appendChild(box);document.body.appendChild(ov);
  setTimeout(()=>{const fi=box.querySelector('input:not([type=date]),textarea');if(fi)fi.focus();},300);
}
function closeModal(){document.getElementById('mo')?.remove();}

// =====================================================
// UTILS
// =====================================================
function fmtDate(d){if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function snack(msg){const el=document.getElementById('snack');el.textContent=msg;el.style.display='block';clearTimeout(snack._t);snack._t=setTimeout(()=>{el.style.display='none';},2600);}

// =====================================================
// INIT
// =====================================================
load();render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
